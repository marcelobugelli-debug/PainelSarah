<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6C5CE7">
<title>Mural · Moderação</title>
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --accent: #6C5CE7; --accent-2: #8E7CF0; --accent-deep: #4B3BC4; --ink: #1E1B2E; --cream: #F6F5FB; --muted: #6E6A85; --line: #DCD8F2; --danger: #D93A12; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; color: var(--ink); background: var(--cream); min-height: 100vh; }
  .btn { appearance: none; border: 0; font: inherit; font-weight: 800; text-decoration: none; cursor: pointer; border-radius: 999px; padding: 12px 20px; display: inline-flex; align-items: center; gap: 8px; transition: transform .1s, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn-primary { color: #fff; background: linear-gradient(135deg, var(--accent-2), var(--accent-deep)); box-shadow: 0 10px 22px -10px #6C5CE7cc; }
  .btn-ghost { background: #fff; border: 2px solid var(--line); color: var(--ink); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn[disabled] { opacity: .55; pointer-events: none; }

  /* Login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login-card { width: 100%; max-width: 380px; background: #fff; border-radius: 24px; padding: 32px 26px; box-shadow: 0 24px 60px -24px #3B2F8F66; text-align: center; }
  .login-card .bot { width: 92px; height: 92px; margin: 0 auto 14px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-2), var(--accent-deep)); display: grid; place-items: center; }
  .login-card .bot svg { width: 64px; }
  .login-card h1 { margin: 0 0 4px; font-size: 26px; font-weight: 900; }
  .login-card p { margin: 0 0 20px; color: var(--muted); }
  input[type=password] { width: 100%; padding: 14px 16px; font: inherit; font-size: 17px; border: 2px solid var(--line); border-radius: 14px; outline: none; margin-bottom: 14px; }
  input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px #6C5CE726; }
  .login-card .btn { width: 100%; justify-content: center; font-size: 17px; padding: 15px; }
  .err { color: var(--danger); font-weight: 600; min-height: 22px; margin-top: 10px; font-size: 15px; }

  /* Painel */
  #panel { display: none; }
  header { position: sticky; top: 0; z-index: 5; background: #F6F5FBee; backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1280px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 20px; margin-right: auto; }
  .brand .logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent-2), var(--accent-deep)); display: grid; place-items: center; }
  .brand .logo svg { width: 30px; }
  .brand small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
  .stat { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 800; }
  .stat b { color: var(--accent-deep); }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: #2BC46A; }
  .live.off i { background: #aaa; }

  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
  .item { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 26px -16px #3B2F8F88; display: flex; flex-direction: column; animation: in .35s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  .item.fresh { box-shadow: 0 0 0 3px var(--accent), 0 10px 26px -16px #3B2F8F88; }
  .item img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block; cursor: zoom-in; background: #ECEAF5; }
  .meta { padding: 10px 12px 12px; display: flex; align-items: center; gap: 8px; }
  .meta div { min-width: 0; flex: 1; }
  .meta strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta span { font-size: 13px; color: var(--muted); }
  .del { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 0; background: #FDE8E8; color: var(--danger); cursor: pointer; display: grid; place-items: center; }
  .del:hover { background: var(--danger); color: #fff; }
  .del svg { width: 20px; height: 20px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 16px; font-size: 18px; }

  /* Modal */
  .modal { position: fixed; inset: 0; z-index: 20; background: #1a0b04cc; display: none; place-items: center; padding: 16px; }
  .modal.on { display: grid; }
  .sheet { background: #fff; border-radius: 22px; max-width: 420px; width: 100%; padding: 18px; text-align: center; }
  .sheet img { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 14px; }
  .sheet h2 { margin: 14px 0 4px; font-size: 22px; }
  .sheet p { margin: 0 0 16px; color: var(--muted); }
  .sheet .row { display: flex; gap: 10px; }
  .sheet .row .btn { flex: 1; justify-content: center; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 600; opacity: 0; transition: all .3s; z-index: 30; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<section id="login">
  <form class="login-card" id="loginForm">
    <div class="bot" id="bot1"></div>
    <h1>Moderação</h1>
    <p>Área restrita da organização</p>
    <input type="password" id="key" placeholder="Senha de moderação" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit" id="enter">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<section id="panel">
  <header>
    <div class="bar">
      <div class="brand"><div class="logo" id="bot2"></div><div><span data-cfg="nome">Mural de Fotos</span><small>Moderação do mural</small></div></div>
      <span class="live" id="live"><i></i> ao vivo</span>
      <span class="stat"><b id="count">0</b> fotos</span>
      <a class="btn btn-ghost" href="/telao" target="_blank">Ver telão</a>
      <button class="btn btn-ghost" id="logout">Sair</button>
    </div>
  </header>
  <main><div class="grid" id="grid"></div></main>
</section>

<div class="modal" id="modal">
  <div class="sheet">
    <img id="mImg" alt="">
    <h2 id="mTitle">Remover esta foto?</h2>
    <p>Ela sai do telão na hora. Essa ação não pode ser desfeita.</p>
    <div class="row">
      <button class="btn btn-ghost" id="mCancel">Cancelar</button>
      <button class="btn btn-danger" id="mDelete">Remover</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/frame.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const robot = window.PainelFrame.logoSVG();
  $('bot1').innerHTML = robot; $('bot2').innerHTML = robot;

  let key = '';
  try { key = sessionStorage.getItem('mural-admin') || ''; } catch {}
  let photos = [], pending = null, es = null;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const when = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

  async function login(k) {
    const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'X-Admin-Key': k } });
    if (r.ok) return true;
    const body = await r.json().catch(() => ({}));
    throw new Error(body.error || 'Senha incorreta');
  }

  $('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    $('loginErr').textContent = '';
    $('enter').disabled = true;
    try {
      const k = $('key').value;
      await login(k);
      key = k;
      try { sessionStorage.setItem('mural-admin', k); } catch {}
      openPanel();
    } catch (err) { $('loginErr').textContent = err.message; }
    finally { $('enter').disabled = false; }
  };

  $('logout').onclick = () => {
    key = '';
    try { sessionStorage.removeItem('mural-admin'); } catch {}
    if (es) es.close();
    location.reload();
  };

  function card(p, fresh) {
    const el = document.createElement('div');
    el.className = 'item' + (fresh ? ' fresh' : '');
    el.dataset.id = p.id;
    el.innerHTML = `<img src="${p.url}" alt="" loading="lazy">
      <div class="meta"><div><strong>${p.name ? esc(p.name) : 'Sem nome'}</strong><span>${when(p.createdAt)}</span></div>
      <button class="del" title="Remover foto" aria-label="Remover foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button></div>`;
    el.querySelector('img').onclick = () => ask(p);
    el.querySelector('.del').onclick = () => ask(p);
    return el;
  }

  function render() {
    $('count').textContent = photos.length;
    const g = $('grid');
    g.innerHTML = '';
    if (!photos.length) { g.innerHTML = '<div class="empty" style="grid-column:1/-1">Nenhuma foto ainda. Elas aparecem aqui em tempo real. 🧡</div>'; return; }
    photos.forEach((p) => g.appendChild(card(p)));
  }

  function ask(p) {
    pending = p;
    $('mImg').src = p.url;
    $('mTitle').textContent = p.name ? `Remover a foto de ${p.name}?` : 'Remover esta foto?';
    $('modal').classList.add('on');
  }
  const close = () => { $('modal').classList.remove('on'); pending = null; };
  $('mCancel').onclick = close;
  $('modal').onclick = (e) => { if (e.target === $('modal')) close(); };
  addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

  $('mDelete').onclick = async () => {
    if (!pending) return;
    const id = pending.id;
    $('mDelete').disabled = true;
    try {
      const r = await fetch(`/api/photos/${id}`, { method: 'DELETE', headers: { 'X-Admin-Key': key } });
      if (r.status === 403) { toast('Sessão expirada, entre de novo'); return setTimeout(() => $('logout').click(), 1200); }
      if (!r.ok && r.status !== 404) throw new Error();
      photos = photos.filter((p) => p.id !== id);
      render();
      toast('Foto removida do telão');
      close();
    } catch { toast('Não foi possível remover. Tente de novo.'); }
    finally { $('mDelete').disabled = false; }
  };

  async function openPanel() {
    $('login').style.display = 'none';
    $('panel').style.display = 'block';
    photos = (await fetch('/api/photos').then((r) => r.json())).reverse();
    render();
    es = new EventSource('/events');
    es.onopen = () => $('live').classList.remove('off');
    es.onerror = () => $('live').classList.add('off');
    es.addEventListener('photo', (e) => {
      const p = JSON.parse(e.data);
      if (photos.some((x) => x.id === p.id)) return;
      photos.unshift(p);
      $('count').textContent = photos.length;
      const g = $('grid');
      if (g.querySelector('.empty')) g.innerHTML = '';
      g.prepend(card(p, true));
    });
    es.addEventListener('remove', (e) => {
      const { id } = JSON.parse(e.data);
      if (!photos.some((x) => x.id === id)) return;
      photos = photos.filter((x) => x.id !== id);
      render();
    });
  }

  if (key) login(key).then(openPanel).catch(() => { try { sessionStorage.removeItem('mural-admin'); } catch {} key = ''; });
})();
</script>
</body>
</html>
