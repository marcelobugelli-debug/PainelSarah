<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mural · Telão</title>
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #6C5CE7; --accent-2: #8E7CF0; --accent-deep: #4B3BC4;
    --bg: #0E0C1A; --ink: #1E1B2E; --text: #F3F2FA; --muted: #B9B5D0;
    --side: clamp(260px, 22vw, 400px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: 'Outfit', system-ui, sans-serif; background: var(--bg); color: var(--text); cursor: default; }

  /* Fundo animado */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; animation: drift 22s ease-in-out infinite alternate; }
  .b1 { width: 55vw; height: 55vw; left: -15vw; top: -20vw; background: var(--accent); }
  .b2 { width: 45vw; height: 45vw; right: -12vw; bottom: -18vw; background: var(--accent-2); animation-delay: -7s; }
  .b3 { width: 30vw; height: 30vw; left: 40vw; top: 50vh; background: var(--accent-deep); animation-delay: -14s; opacity: .45; }
  @keyframes drift { to { transform: translate(6vw, 4vh) scale(1.15); } }
  .grain { position: absolute; inset: 0; background-image: radial-gradient(#ffffff10 1px, transparent 1px); background-size: 22px 22px; }

  .app { position: relative; z-index: 1; height: 100vh; display: grid; grid-template-columns: 1fr var(--side); gap: 2.2vw; padding: 2.4vw; }

  /* Cabeçalho + mural */
  .main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 2vw; margin-bottom: 1.8vw; }
  .title { display: flex; align-items: center; gap: 1.2vw; }
  .logo { width: 4.6vw; height: 4.6vw; min-width: 56px; min-height: 56px; border-radius: 1.3vw; background: radial-gradient(circle at 30% 25%, #FFFFFF, #E6E2FA 60%, #C9C0F5); display: grid; place-items: center; box-shadow: 0 10px 30px -10px #6C5CE7; overflow: hidden; }
  .logo svg { width: 84%; }
  h1 { margin: 0; font-size: clamp(30px, 3.4vw, 72px); font-weight: 900; letter-spacing: .04em; line-height: 1; }
  h1 span { color: var(--accent); }
  .tag { margin: .4vw 0 0; color: var(--muted); font-size: clamp(14px, 1.25vw, 26px); font-weight: 600; }
  .counter { text-align: right; }
  .counter b { display: block; font-size: clamp(34px, 3.6vw, 80px); font-weight: 900; color: var(--accent-2); line-height: 1; font-variant-numeric: tabular-nums; }
  .counter small { color: var(--muted); font-size: clamp(12px, 1vw, 20px); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }

  .wall { flex: 1; min-height: 0; display: grid; gap: 1.4vw; align-content: center; justify-content: center; }
  .card { position: relative; aspect-ratio: 2 / 3; border-radius: .9vw; overflow: hidden; background: #2a1408; box-shadow: 0 1.2vw 2.4vw -1vw #000c; transform: rotate(var(--rot, 0deg)); transition: transform .5s ease; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .msg { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.2em .7em .6em; font-size: clamp(10px, .85vw, 18px); font-weight: 600; line-height: 1.25; color: #fff; background: linear-gradient(transparent, #000c); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card.enter { animation: cardIn .8s cubic-bezier(.2,1.3,.4,1) both; }
  .card.swap img { animation: swap .9s ease both; }
  @keyframes cardIn { from { opacity: 0; transform: scale(.4) rotate(-12deg); } }
  @keyframes swap { from { opacity: 0; transform: scale(1.08); } }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); }
  .empty .big { font-size: clamp(28px, 3vw, 60px); font-weight: 900; color: var(--text); margin: 1vw 0 .5vw; }
  .empty .bot { width: 12vw; margin: 0 auto; animation: bob 2.6s ease-in-out infinite; }
  .empty p { font-size: clamp(16px, 1.4vw, 28px); margin: 0; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }

  /* Lateral com QR Code */
  aside { display: flex; flex-direction: column; gap: 1.4vw; min-height: 0; }
  .qr-card { background: linear-gradient(160deg, var(--accent-2), var(--accent-deep)); border-radius: 1.6vw; padding: 1.8vw; text-align: center; color: #fff; box-shadow: 0 2vw 4vw -2vw #6C5CE7aa; position: relative; overflow: hidden; }
  .qr-card::after { content: ''; position: absolute; width: 60%; aspect-ratio: 1; border-radius: 50%; background: #ffffff1a; right: -20%; top: -20%; }
  .qr-card h2 { margin: 0 0 1.2vw; font-size: clamp(20px, 1.9vw, 40px); font-weight: 900; line-height: 1.1; position: relative; z-index: 1; }
  .qr-box { background: #fff; border-radius: 1.2vw; padding: 1.1vw; aspect-ratio: 1; display: grid; place-items: center; position: relative; z-index: 1; animation: pulse 2.8s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .8vw #ffffff40; } }
  #qr, #qr img, #qr canvas { width: 100% !important; height: auto !important; display: block; image-rendering: pixelated; }
  .url { margin-top: 1vw; font-size: clamp(11px, .85vw, 18px); font-weight: 600; opacity: .9; word-break: break-all; position: relative; z-index: 1; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: .9vw; }
  .steps li { display: flex; align-items: center; gap: 1vw; background: #ffffff0d; border: 1px solid #ffffff17; border-radius: 1vw; padding: 1vw 1.1vw; font-size: clamp(14px, 1.15vw, 24px); font-weight: 600; }
  .steps li span { flex: none; width: 2.3vw; height: 2.3vw; min-width: 30px; min-height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 900; }

  /* Destaque da nova foto */
  .spot { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #0d0502d9; backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  .spot.on { opacity: 1; }
  .spot-inner { display: flex; align-items: center; gap: 4vw; }
  .spot img { height: 86vh; aspect-ratio: 2 / 3; border-radius: 1.4vw; box-shadow: 0 0 0 .5vw #fff, 0 3vw 8vw -2vw #6C5CE7; transform: scale(.6) rotate(-6deg); opacity: 0; transition: transform .8s cubic-bezier(.2,1.4,.4,1), opacity .5s; }
  .spot.on img { transform: none; opacity: 1; }
  .spot-text { max-width: 34vw; transform: translateX(4vw); opacity: 0; transition: all .7s .25s ease; }
  .spot.on .spot-text { transform: none; opacity: 1; }
  .spot-text small { display: inline-block; background: var(--accent); color: #fff; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: .5vw 1.1vw; border-radius: 99px; font-size: clamp(12px, 1.1vw, 22px); }
  .spot-text h3 { font-size: clamp(36px, 4.6vw, 100px); font-weight: 900; line-height: 1.02; margin: 1.2vw 0 .8vw; }
  .spot-text h3 span { color: var(--accent-2); }
  .spot-text p { font-size: clamp(16px, 1.6vw, 34px); color: var(--muted); margin: 0; }
  .spot-text blockquote, .show-text blockquote { margin: 0 0 1.4vw; font-size: clamp(20px, 2.3vw, 52px); font-weight: 700; line-height: 1.2; color: #fff; background: #ffffff12; border-left: .5vw solid var(--accent-2); border-radius: 1vw; padding: 1.2vw 1.5vw; }
  .spot-text blockquote:empty, .show-text blockquote:empty { display: none; }

  /* Vitrine: passa as fotos antigas quando não chegam novas (o QR Code continua visível) */
  .showcase { position: absolute; inset: -1vw; z-index: 4; display: flex; align-items: center; justify-content: center; gap: 3vw; padding: 1vw; background: var(--bg); border-radius: 1.4vw; opacity: 0; pointer-events: none; transition: opacity .8s ease; }
  .showcase.on { opacity: 1; }
  .showcase img { height: min(78vh, 100%); aspect-ratio: 2 / 3; object-fit: cover; border-radius: 1.2vw; box-shadow: 0 0 0 .4vw #fff, 0 2.5vw 6vw -2vw var(--accent); transition: opacity .7s ease, transform .9s ease; }
  .showcase img.out { opacity: 0; transform: scale(.94) rotate(-2deg); }
  .show-text { max-width: 30vw; transition: opacity .7s ease; }
  .show-text.out { opacity: 0; }
  .show-text small { display: inline-block; background: #ffffff1a; color: var(--accent-2); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: .5vw 1.1vw; border-radius: 99px; font-size: clamp(12px, 1vw, 20px); }
  .show-text h3 { font-size: clamp(30px, 3.6vw, 80px); font-weight: 900; line-height: 1.05; margin: 1vw 0; }
  .show-text h3 span { color: var(--accent-2); }

  /* Botão para liberar o som (navegadores exigem um clique) */
  .sound-btn { position: fixed; left: 50%; bottom: 2vw; transform: translateX(-50%); z-index: 30; border: 0; border-radius: 99px; padding: 14px 26px; background: #fff; color: var(--ink); font: inherit; font-size: clamp(14px, 1.2vw, 22px); font-weight: 800; cursor: pointer; box-shadow: 0 10px 30px -8px #000a; animation: nudge 1.6s ease-in-out infinite; }
  .sound-btn.hide { display: none; }
  @keyframes nudge { 50% { transform: translateX(-50%) scale(1.06); } }
  .confetti { position: fixed; inset: 0; z-index: 11; pointer-events: none; }

  .fs-btn { position: fixed; right: 1vw; bottom: 1vw; z-index: 20; border: 0; border-radius: 99px; padding: 8px 14px; background: #ffffff14; color: #fff; font: inherit; font-size: 13px; cursor: pointer; opacity: 0; transition: opacity .3s; }
  body:hover .fs-btn { opacity: .8; }
  .live { display: inline-flex; align-items: center; gap: .5vw; }
  .live i { width: .7vw; height: .7vw; min-width: 9px; min-height: 9px; border-radius: 50%; background: #3BE07A; box-shadow: 0 0 0 0 #3BE07A; animation: live 2s infinite; }
  .live.off i { background: #888; animation: none; }
  @keyframes live { 70% { box-shadow: 0 0 0 .6vw #3BE07A00; } }
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grain"></div></div>

<div class="app">
  <section class="main">
    <header>
      <div class="title">
        <div class="logo" id="logo"></div>
        <div>
          <h1 data-cfg="nome">Mural de Fotos</h1>
          <p class="tag"><span class="live" id="live"><i></i> <span data-cfg="subtitulo"></span></span></p>
        </div>
      </div>
      <div class="counter"><b id="count">0</b><small>participantes</small></div>
    </header>
    <div class="wall" id="wall"></div>
    <div class="showcase" id="showcase">
      <img id="showImg" alt="">
      <div class="show-text" id="showText">
        <small>Relembrando 💜</small>
        <h3 id="showName"></h3>
        <blockquote id="showMsg"></blockquote>
      </div>
    </div>
  </section>

  <aside>
    <div class="qr-card">
      <h2>Escaneie e apareça aqui! 📸</h2>
      <div class="qr-box"><div id="qr"></div></div>
      <div class="url" id="url"></div>
    </div>
    <ol class="steps">
      <li><span>1</span> Aponte a câmera do celular para o QR Code</li>
      <li><span>2</span> Tire uma selfie com a moldura</li>
      <li><span>3</span> Envie e veja sua foto no telão!</li>
    </ol>
  </aside>
</div>

<div class="spot" id="spot">
  <div class="spot-inner">
    <img id="spotImg" alt="">
    <div class="spot-text">
      <small>Nova foto no mural</small>
      <h3 id="spotName"></h3>
      <blockquote id="spotMsg"></blockquote>
      <p data-cfg="agradecimento"></p>
    </div>
  </div>
</div>
<canvas class="confetti" id="confetti"></canvas>
<button class="fs-btn" id="fs">Tela cheia (F)</button>
<button class="sound-btn" id="soundBtn">🔊 Clique aqui para ativar o som da festa</button>

<script src="/vendor/qrcode.min.js"></script>
<script src="/frame.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const robot = window.PainelFrame.logoSVG();
  $('logo').innerHTML = robot;

  let photos = [];            // todas, mais nova primeiro
  let shown = [];             // ids exibidos no mural, na ordem dos cards
  let slots = 12, cols = 4;
  const queue = []; let spotlightBusy = false;

  // Calcula quantas fotos cabem no mural sem rolagem
  function layout() {
    const wall = $('wall');
    const W = wall.clientWidth, H = wall.clientHeight;
    const gap = window.innerWidth * 0.014;
    let best = { c: 1, r: 1, cw: 0, score: -1 };
    const want = Math.max(photos.length, 1);
    for (let c = 1; c <= 9; c++) {
      for (let r = 1; r <= 5; r++) {
        // maior card que cabe na largura e na altura
        const cw = Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r / 1.5);
        if (cw < 60) continue;
        // prioriza mostrar todas as fotos; depois, cards maiores
        const score = Math.min(c * r, want) * 100000 + cw;
        if (score > best.score) best = { c, r, cw, score };
      }
    }
    cols = best.c; slots = best.c * best.r;
    wall.style.gridTemplateColumns = `repeat(${cols}, ${best.cw}px)`;
  }

  const rot = () => `${(Math.random() * 5 - 2.5).toFixed(2)}deg`;

  function cardEl(p, cls) {
    const d = document.createElement('div');
    d.className = 'card ' + (cls || '');
    d.dataset.id = p.id;
    d.style.setProperty('--rot', rot());
    const img = new Image(); img.src = p.url; img.alt = p.name || 'Participante';
    d.appendChild(img);
    if (p.message) { const m = document.createElement('div'); m.className = 'msg'; m.textContent = `“${p.message}”`; d.appendChild(m); }
    return d;
  }

  function render() {
    layout();
    const wall = $('wall');
    wall.innerHTML = '';
    $('count').textContent = photos.length;
    if (!photos.length) {
      wall.innerHTML = `<div class="empty"><div class="bot">${robot}</div><div class="big">Seja o primeiro a aparecer aqui!</div><p>Escaneie o QR Code ao lado e tire sua foto 📸</p></div>`;
      shown = [];
      return;
    }
    shown = photos.slice(0, slots).map((p) => p.id);
    shown.forEach((id) => wall.appendChild(cardEl(photos.find((p) => p.id === id))));
  }

  function addToWall(p) {
    const wall = $('wall');
    if (photos.length === 1 || wall.querySelector('.empty')) return render();
    layout();
    wall.prepend(cardEl(p, 'enter'));
    shown.unshift(p.id);
    while (shown.length > slots) { shown.pop(); wall.lastElementChild.remove(); }
  }

  // Quando há mais fotos que espaço, troca uma foto antiga de tempos em tempos
  setInterval(() => {
    if (spotlightBusy || photos.length <= slots) return;
    const hidden = photos.filter((p) => !shown.includes(p.id));
    if (!hidden.length) return;
    const p = hidden[Math.floor(Math.random() * hidden.length)];
    const idx = 3 + Math.floor(Math.random() * Math.max(1, shown.length - 3)); // preserva as 3 mais recentes
    const card = $('wall').children[idx];
    if (!card) return;
    const img = new Image();
    img.onload = () => {
      card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap');
      card.replaceChildren(...cardEl(p).childNodes); card.dataset.id = p.id; shown[idx] = p.id;
    };
    img.src = p.url; img.alt = p.name || 'Participante';
  }, 5000);

  // Destaque de nova foto
  function spotlight(p) {
    queue.push(p);
    stopShowcase();
    if (!spotlightBusy) nextSpot();
  }
  function nextSpot() {
    const p = queue.shift();
    if (!p) { spotlightBusy = false; scheduleShowcase(); return; }
    spotlightBusy = true;
    const img = $('spotImg');
    img.onload = () => {
      $('spotName').innerHTML = p.name ? `Olá, <span>${escapeHtml(p.name)}</span>!` : 'Mais um <span>participante!</span>';
      $('spotMsg').textContent = p.message ? `“${p.message}”` : '';
      $('spot').classList.add('on');
      celebrate();
      setTimeout(() => {
        $('spot').classList.remove('on');
        addToWall(p);
        setTimeout(nextSpot, 900);
      }, p.message ? 8000 : 6000);
    };
    img.onerror = () => { addToWall(p); nextSpot(); };
    img.src = p.url;
  }
  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Confete nas cores do tema
  const cv = $('confetti'), cx = cv.getContext('2d');
  let parts = [], raf = null;
  function burst() {
    if (cv.width !== innerWidth || cv.height !== innerHeight) { cv.width = innerWidth; cv.height = innerHeight; }
    const K = window.PAINEL.cores; const colors = [K.destaque, K.destaqueClaro, '#FFD27A', '#FFFFFF', K.destaqueEscuro];
    for (let i = 0; i < 220; i++) {
      parts.push({
        x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .3, y: innerHeight * .55,
        vx: (Math.random() - .5) * 22, vy: -Math.random() * 24 - 8, r: Math.random() * 8 + 5,
        a: Math.random() * 6, va: (Math.random() - .5) * .4, c: colors[i % colors.length], life: 0,
      });
    }
    if (!raf) tick();
  }
  function tick() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter((p) => p.y < cv.height + 40 && p.life < (p.fw ? 75 : 260));
    for (const p of parts) {
      if (p.fw) {
        p.vy += .08; p.vx *= .97; p.vy *= .97; p.x += p.vx; p.y += p.vy; p.life++;
        cx.globalAlpha = Math.max(0, 1 - p.life / 75); cx.fillStyle = p.c;
        cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); cx.globalAlpha = 1;
        continue;
      }
      p.vy += .5; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life++;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c;
      cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cv.width, cv.height), null);
  }

  // ---------- Fogos de artifício ----------
  function fireworks() {
    const K = window.PAINEL.cores; const colors = [K.destaqueClaro, '#FFD27A', '#FF8FB1', '#7EE0C3', '#FFFFFF'];
    for (let n = 0; n < 6; n++) {
      setTimeout(() => {
        cv.width = cv.width || innerWidth; cv.height = cv.height || innerHeight;
        const x = innerWidth * (0.12 + Math.random() * 0.76), y = innerHeight * (0.12 + Math.random() * 0.35);
        const c = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 80; i++) {
          const a = (Math.PI * 2 * i) / 80, sp = 4 + Math.random() * 7;
          parts.push({ fw: true, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3 + Math.random() * 3, c, life: 0 });
        }
        sfx.pop();
        if (!raf) tick();
      }, 350 + n * 520);
    }
  }
  function celebrate() { burst(); fireworks(); sfx.fanfare(); }

  // ---------- Som (gerado no navegador; dá para trocar por um arquivo em config.js) ----------
  const sfx = (() => {
    let ac = null, enabled = false;
    const custom = window.PAINEL.somComemoracao ? new Audio(window.PAINEL.somComemoracao) : null;
    function enable() {
      enabled = true;
      try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch {}
      if (custom) { custom.volume = 0.0001; custom.play().then(() => { custom.pause(); custom.currentTime = 0; custom.volume = 1; }).catch(() => {}); }
    }
    function note(freq, t, dur, type = 'triangle', vol = 0.18) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
    }
    function fanfare() {
      if (!enabled) return;
      if (custom) { custom.currentTime = 0; custom.play().catch(() => {}); return; }
      if (!ac) return;
      const t = ac.currentTime + 0.05, C5 = 523.25, E5 = 659.25, G5 = 783.99, C6 = 1046.5, A5 = 880, F5 = 698.46;
      [[C5, 0], [E5, .14], [G5, .28], [C6, .42]].forEach(([f, d]) => note(f, t + d, .22, 'square', .07));
      [[G5, .7], [A5, .82], [G5, .94], [F5, 1.06], [E5, 1.18], [G5, 1.3]].forEach(([f, d]) => note(f, t + d, .16, 'triangle', .16));
      [C5, E5, G5, C6].forEach((f) => note(f, t + 1.5, 1.4, 'triangle', .1));
      [C5 / 2, G5 / 2].forEach((f) => note(f, t + 1.5, 1.4, 'sine', .14));
    }
    function pop() {
      if (!enabled || !ac || custom) return;
      const len = ac.sampleRate * 0.35, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 1400; g.gain.value = 0.35;
      src.buffer = buf; src.connect(f).connect(g).connect(ac.destination); src.start();
    }
    return { enable, fanfare, pop };
  })();
  function unlockSound() { sfx.enable(); $('soundBtn').classList.add('hide'); sfx.fanfare(); }
  $('soundBtn').onclick = (e) => { e.stopPropagation(); unlockSound(); };
  addEventListener('keydown', (e) => { if (e.key !== 'f' && e.key !== 'F' && !$('soundBtn').classList.contains('hide')) unlockSound(); });

  // ---------- Vitrine (carrossel das fotos antigas) ----------
  const WAIT = (window.PAINEL.carrosselEsperaSegundos ?? 20) * 1000, EACH = (window.PAINEL.carrosselTrocaSegundos ?? 7) * 1000;
  let idleT = null, showT = null, showing = false, lastShown = null;
  function scheduleShowcase() {
    clearTimeout(idleT);
    if (WAIT <= 0) return;
    idleT = setTimeout(startShowcase, WAIT);
  }
  function startShowcase() {
    if (spotlightBusy || !photos.length) return scheduleShowcase();
    showing = true; nextShow(true);
  }
  function nextShow(first) {
    if (!showing) return;
    const pool = photos.length > 1 ? photos.filter((p) => p.id !== lastShown) : photos;
    const p = pool[Math.floor(Math.random() * pool.length)];
    if (!p) return stopShowcase();
    if (!first && p.id === lastShown) { showT = setTimeout(() => nextShow(false), EACH); return; }
    lastShown = p.id;
    const img = $('showImg'), txt = $('showText');
    img.classList.add('out'); txt.classList.add('out');
    setTimeout(() => {
      const pre = new Image();
      pre.onload = () => {
        if (!showing) return;
        img.src = p.url;
        $('showName').innerHTML = p.name ? `<span>${escapeHtml(p.name)}</span>` : 'Um convidado';
        $('showMsg').textContent = p.message ? `“${p.message}”` : '';
        $('showcase').classList.add('on');
        img.classList.remove('out'); txt.classList.remove('out');
        showT = setTimeout(() => nextShow(false), EACH);
      };
      pre.onerror = () => { showT = setTimeout(() => nextShow(false), 500); };
      pre.src = p.url;
    }, first ? 0 : 700);
  }
  function stopShowcase() {
    showing = false; clearTimeout(showT); clearTimeout(idleT);
    $('showcase').classList.remove('on');
  }

  // Dados + tempo real
  async function load() {
    const [info, list] = await Promise.all([
      fetch('/api/info').then((r) => r.json()),
      fetch('/api/photos').then((r) => r.json()),
    ]);
    $('url').textContent = info.captureUrl.replace(/^https?:\/\//, '');
    $('qr').innerHTML = '';
    new QRCode($('qr'), { text: info.captureUrl, width: 512, height: 512, colorDark: '#1E1B2E', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M });
    photos = list.slice().reverse();
    render();
    scheduleShowcase();
  }

  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => $('live').classList.remove('off');
    es.onerror = () => $('live').classList.add('off');
    es.addEventListener('photo', (e) => {
      const p = JSON.parse(e.data);
      if (photos.some((x) => x.id === p.id)) return;
      photos.unshift(p);
      $('count').textContent = photos.length;
      spotlight(p);
    });
    es.addEventListener('remove', (e) => {
      const { id } = JSON.parse(e.data);
      photos = photos.filter((p) => p.id !== id);
      if (lastShown === id && showing) { clearTimeout(showT); nextShow(false); }
      render();
    });
    es.addEventListener('reset', () => { photos = []; stopShowcase(); render(); });
  }

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 200); });
  const fs = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  $('fs').onclick = fs;
  addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') fs(); });

  load().then(connect).catch((e) => { console.error(e); setTimeout(() => location.reload(), 5000); });
})();
</script>
