<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mural · Telão</title>
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Monoton&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #FF3FA4; --accent-2: #FF8AD0; --accent-deep: #7B2CBF;
    --bg: #14061F; --ink: #1E1B2E; --text: #F3F2FA; --muted: #B9B5D0;
    --side: clamp(190px, 14vw, 270px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: 'Outfit', system-ui, sans-serif; background: var(--bg); color: var(--text); cursor: default; }

  /* Fundo animado */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .slides { position: absolute; inset: 0; }
  .slides .slide { position: absolute; top: 0; bottom: 0; width: 46vw; background-size: cover; background-position: center 20%; opacity: 0; transition: opacity 2s ease, transform 9s ease; transform: scale(1.05); }
  .slides .slide:nth-child(odd) { left: 0; -webkit-mask-image: linear-gradient(90deg, #000 55%, transparent); mask-image: linear-gradient(90deg, #000 55%, transparent); }
  .slides .slide:nth-child(even) { right: 0; -webkit-mask-image: linear-gradient(270deg, #000 55%, transparent); mask-image: linear-gradient(270deg, #000 55%, transparent); }
  .slides .slide.on { opacity: .75; transform: scale(1); }
  .slides::after { content: ''; position: absolute; inset: 0; background: radial-gradient(70% 90% at 50% 50%, #0A061299, #0A0612dd); }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; animation: drift 22s ease-in-out infinite alternate; }
  .b1 { width: 55vw; height: 55vw; left: -15vw; top: -20vw; background: var(--accent); }
  .b2 { width: 45vw; height: 45vw; right: -12vw; bottom: -18vw; background: var(--accent-2); animation-delay: -7s; }
  .b3 { width: 30vw; height: 30vw; left: 40vw; top: 50vh; background: var(--accent-deep); animation-delay: -14s; opacity: .45; }
  @keyframes drift { to { transform: translate(6vw, 4vh) scale(1.15); } }
  .grain { position: absolute; inset: 0; background-image: radial-gradient(#ffffff22 1.2px, transparent 1.4px); background-size: 28px 28px; mask-image: linear-gradient(to bottom, #000, transparent 75%); }
  .beam { position: absolute; top: -12vh; width: 22vw; height: 135vh; transform-origin: 50% 0; mix-blend-mode: screen; filter: blur(3px); opacity: .42; }
  .beam.l1 { left: 6vw; background: linear-gradient(to bottom, var(--accent), transparent 72%); clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); animation: sweep 7s ease-in-out infinite alternate; }
  .beam.l2 { right: 20vw; background: linear-gradient(to bottom, var(--accent-2), transparent 72%); clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); animation: sweep 8s ease-in-out infinite alternate-reverse; }
  .beam.l3 { left: 38vw; background: linear-gradient(to bottom, #fff, transparent 60%); clip-path: polygon(47% 0, 53% 0, 80% 100%, 20% 100%); opacity: .14; animation: sweep 11s ease-in-out infinite alternate; }
  @keyframes sweep { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
  .floor { position: absolute; left: -10%; right: -10%; bottom: -12vh; height: 45vh; background: radial-gradient(55% 70% at 50% 100%, color-mix(in srgb, var(--accent) 40%, transparent), transparent 70%); }
  .tw { position: absolute; width: 1.1vw; height: 1.1vw; min-width: 10px; min-height: 10px; background: #fff; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { transform: scale(.4); opacity: .25; } 50% { transform: scale(1); opacity: 1; } }

  /* Faixa animada no rodapé */
  .ticker { position: fixed; left: -5vw; right: -5vw; bottom: 0; z-index: 3; background: var(--accent); color: #fff; font-family: 'Anton', sans-serif; font-size: clamp(14px, 1.25vw, 26px); letter-spacing: .14em; padding: .55vw 0; white-space: nowrap; overflow: hidden; transform: rotate(-1deg); transform-origin: 50% 100%; box-shadow: 0 -10px 40px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
  .ticker-track { display: inline-block; animation: marquee 40s linear infinite; }
  @keyframes marquee { to { transform: translateX(-50%); } }

  .app { position: relative; z-index: 1; height: 100vh; display: grid; grid-template-columns: 1fr var(--side); column-gap: 2vw; padding: 2vw 2.4vw calc(2.4vw + 3vw); transition: grid-template-columns .45s ease, column-gap .45s ease; }
  .app.no-side { grid-template-columns: 1fr 0px; column-gap: 0; }

  /* Cabeçalho + mural */
  .main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 2vw; margin-bottom: 1.4vw; }
  .title, .counter { position: relative; z-index: 2; }
  .wall { position: relative; z-index: 2; }
  .title { display: flex; align-items: center; gap: 1.2vw; min-width: 0; }
  .logo { display: none; width: 4.6vw; height: 4.6vw; min-width: 56px; min-height: 56px; border-radius: 1.3vw; background: radial-gradient(circle at 30% 25%, #FFFFFF, var(--tint-1) 60%, var(--tint-3)); display: grid; place-items: center; box-shadow: 0 10px 30px -10px var(--accent); overflow: hidden; }
  .logo svg { width: 84%; }
  .disco { width: 6.2vw; min-width: 64px; flex: none; margin-top: -2vw; transform-origin: 50% 0; animation: swing 4s ease-in-out infinite; filter: drop-shadow(0 0 2vw color-mix(in srgb, var(--accent-2) 70%, transparent)); }
  .disco svg { width: 100%; display: block; }
  .disco.avatar { width: 7.4vw; height: 7.4vw; min-width: 76px; min-height: 76px; margin-top: 0; border-radius: 50%; padding: .32vw; background: conic-gradient(from 200deg, var(--accent), var(--accent-2), #fff, var(--accent)); animation: none; box-shadow: 0 0 2.6vw -.3vw var(--accent); }
  .disco.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: .3vw solid var(--bg); }
  .empty { display: flex; align-items: center; justify-content: center; gap: 4vw; text-align: left !important; }
  .empty .art { height: min(62vh, 40vw); aspect-ratio: 4 / 5; object-fit: cover; border-radius: 1.2vw; box-shadow: 0 0 0 .45vw #fff, 0 2.5vw 6vw -1.5vw var(--accent); transform: rotate(-3deg); }
  .empty .copy { max-width: 32vw; }
  .empty .copy small { display: inline-block; color: var(--accent-2); font-weight: 800; letter-spacing: .28em; text-transform: uppercase; font-size: clamp(12px, .95vw, 20px); }
  @keyframes swing { 50% { transform: rotate(6deg); } }
  h1 { margin: 0; line-height: .9; display: flex; align-items: baseline; gap: 1vw; flex-wrap: nowrap; white-space: nowrap; font-weight: 400; }
  h1 .name { font-family: 'Anton', sans-serif; font-size: clamp(44px, 5.2vw, 130px); letter-spacing: .02em; text-transform: uppercase; color: transparent; -webkit-text-stroke: .16vw #fff; text-shadow: 0 0 2.4vw color-mix(in srgb, var(--accent) 55%, transparent); position: relative; }
  h1 .name::after { content: attr(data-txt); position: absolute; inset: 0; clip-path: inset(52% 0 0 0); -webkit-text-stroke: 0; background: linear-gradient(90deg, var(--accent), #FF8AD0, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 .age { font-family: 'Anton', sans-serif; font-size: clamp(18px, 2vw, 48px); letter-spacing: .1em; text-transform: uppercase; color: #fff; }
  h1 .age b { font-family: 'Monoton', cursive; font-weight: 400; font-size: 1.9em; line-height: 1; margin: 0 .15em; color: #fff; text-shadow: 0 0 .3vw #fff, 0 0 1vw var(--accent), 0 0 2.2vw var(--accent), 0 0 4vw var(--accent); animation: flicker 5s infinite; }
  @keyframes flicker { 0%, 18%, 22%, 60%, 64%, 100% { opacity: 1; } 20%, 62% { opacity: .55; } }
  h1 span { color: var(--accent); }
  .tag { margin: .8vw 0 0; display: inline-flex; color: var(--accent-2); font-size: clamp(12px, .95vw, 20px); font-weight: 800; letter-spacing: .28em; text-transform: uppercase; border: 1.5px solid color-mix(in srgb, var(--accent-2) 55%, transparent); padding: .45vw 1vw; border-radius: 99px; background: #0A061299; }
  .counter { text-align: right; margin-top: 7.2vw; margin-left: auto; }
  /* Marca d'água no canto superior direito: as artes girando sob as luzes, sem moldura */
  .ministage { position: absolute; right: -2vw; top: -2.4vw; width: 40vw; height: 27vw; z-index: 0; pointer-events: none;
    -webkit-mask-image: radial-gradient(closest-side at 55% 45%, #000 45%, transparent 100%); mask-image: radial-gradient(closest-side at 55% 45%, #000 45%, transparent 100%); }
  .ms-beam { position: absolute; top: -10%; width: 45%; height: 130%; transform-origin: 50% 0; mix-blend-mode: screen; filter: blur(3px); clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); z-index: 2; }
  .ms-beam.l { left: 2%; background: linear-gradient(var(--accent), transparent 85%); opacity: .45; animation: msL 5s ease-in-out infinite alternate; }
  .ms-beam.r { right: 2%; background: linear-gradient(var(--accent-2), transparent 85%); opacity: .4; animation: msR 6s ease-in-out infinite alternate; }
  .ms-beam.c { left: 28%; background: linear-gradient(#fff, transparent 70%); opacity: .14; }
  @keyframes msL { from { transform: rotate(-26deg); } to { transform: rotate(-4deg); } }
  @keyframes msR { from { transform: rotate(26deg); } to { transform: rotate(4deg); } }
  .ms-floor { display: none; }
  .ms-card { position: absolute; inset: 0; z-index: 1; }
  .ms-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; opacity: 0; transform: scale(1.06); filter: saturate(1.1); transition: opacity 1.6s ease, transform 6s ease; }
  .ms-card img.on { opacity: .42; transform: scale(1); }
  .ms-tw { position: absolute; z-index: 3; width: .8vw; height: .8vw; min-width: 8px; min-height: 8px; background: #fff; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: twinkle 2.4s ease-in-out infinite; }
  .counter b { display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-size: clamp(40px, 4.6vw, 100px); color: #fff; text-shadow: 0 0 1.4vw var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
  .counter small { color: var(--muted); font-size: clamp(12px, 1vw, 20px); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }

  .wall { flex: 1; min-height: 0; display: grid; gap: 1.4vw; align-content: center; justify-content: center; }
  .card { position: relative; aspect-ratio: 2 / 3; border-radius: .9vw; overflow: hidden; background: color-mix(in srgb, var(--accent-deep) 35%, #000); box-shadow: 0 1.2vw 2.4vw -1vw #000c; transform: rotate(var(--rot, 0deg)); transition: transform .5s ease; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card.video img { object-fit: contain; background: #000; }
  .card .play { position: absolute; left: 50%; top: 50%; width: 3.6vw; height: 3.6vw; min-width: 34px; min-height: 34px; transform: translate(-50%, -50%); border-radius: 50%; background: #000000a0; border: 2px solid #fff; display: grid; place-items: center; }
  .card .play::after { content: ''; margin-left: 12%; border-left: 1.1vw solid #fff; border-top: .7vw solid transparent; border-bottom: .7vw solid transparent; }
  .card .msg { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.2em .7em .6em; font-size: clamp(10px, .85vw, 18px); font-weight: 600; line-height: 1.25; color: #fff; background: linear-gradient(transparent, #000c); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card.enter { animation: cardIn .8s cubic-bezier(.2,1.3,.4,1) both; }
  .card.swap img { animation: swap .9s ease both; }
  @keyframes cardIn { from { opacity: 0; transform: scale(.4) rotate(-12deg); } }
  @keyframes swap { from { opacity: 0; transform: scale(1.08); } }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); }
  .empty .big { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .03em; font-size: clamp(30px, 3.4vw, 72px); color: var(--text); margin: 1vw 0 .5vw; }
  .empty .bot { width: 9vw; margin: 0 auto; animation: bob 2.6s ease-in-out infinite; }
  .empty p { font-size: clamp(16px, 1.4vw, 28px); margin: 0; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }

  /* Lateral com QR Code */
  aside { display: flex; flex-direction: column; gap: .9vw; min-height: 0; min-width: 0; overflow: hidden; transition: opacity .3s ease; }
  .app.no-side aside { opacity: 0; pointer-events: none; }
  .qr-card { background: linear-gradient(160deg, var(--accent-2), var(--accent-deep)); border-radius: 1.3vw; padding: 1.1vw; text-align: center; color: #fff; box-shadow: 0 2vw 4vw -2vw color-mix(in srgb, var(--accent) 67%, transparent); position: relative; overflow: hidden; }
  .qr-card::after { content: ''; position: absolute; width: 60%; aspect-ratio: 1; border-radius: 50%; background: #ffffff1a; right: -20%; top: -20%; }
  .qr-card h2 { margin: 0 0 .8vw; font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: .06em; text-transform: uppercase; font-size: clamp(15px, 1.3vw, 28px); line-height: 1.1; position: relative; z-index: 1; }
  .qr-box { background: #fff; border-radius: 1.2vw; padding: 1.1vw; aspect-ratio: 1; display: grid; place-items: center; position: relative; z-index: 1; animation: pulse 2.8s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .8vw #ffffff40; } }
  #qr, #qr img, #qr canvas { width: 100% !important; height: auto !important; display: block; image-rendering: pixelated; }
  .url { margin-top: .6vw; font-size: clamp(10px, .7vw, 15px); font-weight: 600; opacity: .9; word-break: break-all; position: relative; z-index: 1; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: .9vw; }
  .steps li { display: flex; align-items: center; gap: .7vw; background: #ffffff0d; border: 1px solid #ffffff17; border-radius: .8vw; padding: .6vw .8vw; font-size: clamp(11px, .82vw, 17px); font-weight: 600; line-height: 1.25; }
  .steps li span { flex: none; width: 1.7vw; height: 1.7vw; min-width: 22px; min-height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 900; }

  /* Destaque da nova foto */
  .spot { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  .spot.on { opacity: 1; }
  .spot-inner { display: flex; align-items: center; gap: 4vw; }
  .spot img { height: 86vh; aspect-ratio: 2 / 3; border-radius: 1.4vw; box-shadow: 0 0 0 .5vw #fff, 0 3vw 8vw -2vw var(--accent); transform: scale(.6) rotate(-6deg); opacity: 0; transition: transform .8s cubic-bezier(.2,1.4,.4,1), opacity .5s; }
  .spot.on img { transform: none; opacity: 1; }
  .spot img.is-video { aspect-ratio: 9 / 16; object-fit: cover; }
  .spot video.tv { height: 86vh; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 1.4vw; box-shadow: 0 0 0 .5vw #fff, 0 3vw 8vw -2vw var(--accent); background: #000; }
  .spot-text { max-width: 34vw; transform: translateX(4vw); opacity: 0; transition: all .7s .25s ease; }
  .spot.on .spot-text { transform: none; opacity: 1; }
  .spot-text small { display: inline-block; background: var(--accent); color: #fff; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: .5vw 1.1vw; border-radius: 99px; font-size: clamp(12px, 1.1vw, 22px); }
  .spot-text h3 { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(40px, 5.2vw, 120px); line-height: 1.02; margin: 1.2vw 0 .8vw; }
  .spot-text h3 span { color: var(--accent-2); }
  .spot-text p { font-size: clamp(16px, 1.6vw, 34px); color: var(--muted); margin: 0; }
  .spot-text blockquote, .show-text blockquote { margin: 0 0 1.4vw; font-size: clamp(20px, 2.3vw, 52px); font-weight: 700; line-height: 1.2; color: #fff; background: #ffffff12; border-left: .5vw solid var(--accent-2); border-radius: 1vw; padding: 1.2vw 1.5vw; }
  .spot-text blockquote:empty, .show-text blockquote:empty { display: none; }

  /* Vitrine: passa as fotos antigas quando não chegam novas (o QR Code continua visível) */
  .showcase { position: absolute; inset: -1vw; z-index: 4; display: flex; align-items: center; justify-content: center; gap: 3vw; padding: 1vw; background: var(--bg); border-radius: 1.4vw; opacity: 0; pointer-events: none; transition: opacity .8s ease; }
  .showcase.on { opacity: 1; }
  .showcase img { height: min(78vh, 100%); aspect-ratio: 2 / 3; object-fit: cover; border-radius: 1.2vw; box-shadow: 0 0 0 .4vw #fff, 0 2.5vw 6vw -2vw var(--accent); transition: opacity .7s ease, transform .9s ease; }
  .showcase img.out { opacity: 0; transform: scale(.94) rotate(-2deg); }
  .showcase img.is-video { aspect-ratio: 9 / 16; }
  .showcase video.tv { height: min(78vh, 100%); aspect-ratio: 9 / 16; object-fit: cover; border-radius: 1.2vw; box-shadow: 0 0 0 .4vw #fff, 0 2.5vw 6vw -2vw var(--accent); background: #000; }
  .show-text { max-width: 30vw; transition: opacity .7s ease; }
  .show-text.out { opacity: 0; }
  .show-text small { display: inline-block; background: #ffffff1a; color: var(--accent-2); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: .5vw 1.1vw; border-radius: 99px; font-size: clamp(12px, 1vw, 20px); }
  .show-text h3 { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(34px, 4.2vw, 96px); line-height: 1.05; margin: 1vw 0; }
  .show-text h3 span { color: var(--accent-2); }

  /* Botão para liberar o som (navegadores exigem um clique) */
  .sound-btn { position: fixed; left: 50%; bottom: 5vw; transform: translateX(-50%); z-index: 30; border: 0; border-radius: 99px; padding: 14px 26px; background: #fff; color: var(--ink); font: inherit; font-size: clamp(14px, 1.2vw, 22px); font-weight: 800; cursor: pointer; box-shadow: 0 10px 30px -8px #000a; animation: nudge 1.6s ease-in-out infinite; }
  .sound-btn.hide { display: none; }
  @keyframes nudge { 50% { transform: translateX(-50%) scale(1.06); } }
  .confetti { position: fixed; inset: 0; z-index: 11; pointer-events: none; }

  /* Botão para mostrar/esconder a lateral do QR Code */
  .side-btn { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 20; border: 0; border-radius: 14px 0 0 14px; padding: 14px 10px; background: #ffffff1c; color: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; writing-mode: vertical-rl; letter-spacing: .08em; opacity: .25; transition: opacity .3s, background .3s; }
  .side-btn:hover, body:hover .side-btn { opacity: .85; }
  .app.no-side ~ .side-btn { background: var(--accent); opacity: .7; }
  .fs-btn { position: fixed; right: 1vw; bottom: 1vw; z-index: 20; border: 0; border-radius: 99px; padding: 8px 14px; background: #ffffff14; color: #fff; font: inherit; font-size: 13px; cursor: pointer; opacity: 0; transition: opacity .3s; }
  body:hover .fs-btn { opacity: .8; }
  .live { display: inline-flex; align-items: center; gap: .5vw; }
  .live i { width: .7vw; height: .7vw; min-width: 9px; min-height: 9px; border-radius: 50%; background: #3BE07A; box-shadow: 0 0 0 0 #3BE07A; animation: live 2s infinite; }
  .live.off i { background: #888; animation: none; }
  @keyframes live { 70% { box-shadow: 0 0 0 .6vw #3BE07A00; } }

  /* ================= Galeria no celular (só em tela de toque estreita; no computador nada muda) ================= */
  #mob { display: none; }
  body.m { overflow: auto; height: auto; }
  body.m .app, body.m .ticker, body.m .side-btn, body.m .fs-btn, body.m .sound-btn, body.m .spot, body.m .confetti { display: none !important; }
  body.m .bg .beam, body.m .bg .tw, body.m .bg .slides { display: none; }
  body.m #mob { display: block; position: relative; z-index: 1; min-height: 100dvh; padding: max(14px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom)); }
  .mhead { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 0 -12px 12px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid #ffffff14; }
  .mhead .mdisco { width: 34px; flex: none; }
  .mhead .mdisco svg { width: 100%; display: block; }
  .mhead .mt { flex: 1; min-width: 0; line-height: 1; }
  .mhead .mt b { display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; background: linear-gradient(90deg, var(--accent), #FF8AD0, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mhead .mt small { display: block; margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--accent-2); }
  .mhead .mc { text-align: right; line-height: 1; }
  .mhead .mc b { display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 26px; color: #fff; }
  .mhead .mc small { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mitem { position: relative; aspect-ratio: 2 / 3; border-radius: 12px; overflow: hidden; background: #1a1026; border: 0; padding: 0; cursor: pointer; box-shadow: 0 8px 20px -10px #000; }
  .mitem.new { animation: mIn .6s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes mIn { from { opacity: 0; transform: scale(.7); } }
  .mitem img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mitem.video img { object-fit: contain; background: #000; }
  .mitem .mplay { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; transform: translate(-50%, -50%); border-radius: 50%; background: #000000a0; border: 2px solid #fff; display: grid; place-items: center; }
  .mitem .mplay::after { content: ''; margin-left: 4px; border-left: 13px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
  .mitem .mname { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 7px; font-size: 12px; font-weight: 700; color: #fff; text-align: left; background: linear-gradient(transparent, #000c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mempty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .mempty img { width: 70%; max-width: 280px; border-radius: 14px; margin: 0 auto 16px; display: block; box-shadow: 0 0 0 3px #fff; }
  .mempty b { display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 26px; text-transform: uppercase; color: #fff; margin-bottom: 6px; }

  .mview.on { display: flex; }
  .mview .mmedia { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }

  .mview .mcap p { margin: 6px 0 0; font-size: 15px; color: #fff; font-style: italic; }
  .mview .mclose { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 10px; z-index: 2; width: 42px; height: 42px; border-radius: 50%; border: 1px solid #ffffff33; background: #ffffff1a; color: #fff; font-size: 22px; cursor: pointer; }
  .mview .mnav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 40px; height: 56px; border: 0; border-radius: 12px; background: #ffffff1a; color: #fff; font-size: 24px; cursor: pointer; }

<body>

  <section class="main">

<script src="/vendor/qrcode.min.js"></script>
<script src="/frame.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const robot = window.PainelFrame.logoSVG();
  $('logo').innerHTML = robot;
  const P = window.PAINEL;
  const ARTES = P.artes || {};
  $('disco').innerHTML = window.PainelFrame.discoSVG();
  // Palquinho: alterna as artes sob a luz
  const PALCO = P.palco || [];
  if (!PALCO.length) $('ministage').style.display = 'none';
  PALCO.forEach((u, i) => { const im = new Image(); im.src = u; im.alt = ''; if (i === 0) im.className = 'on'; $('msCard').appendChild(im); });
  if (PALCO.length > 1) { let m = 0; setInterval(() => { const all = $('msCard').children; all[m].classList.remove('on'); m = (m + 1) % all.length; all[m].classList.add('on'); }, 5000); }
  // Fotos da aniversariante girando no fundo do telão
  (P.fundo || []).forEach((u, i) => { const d = document.createElement('div'); d.className = 'slide' + (i === 0 ? ' on' : ''); d.style.backgroundImage = `url("${u}")`; $('slides').appendChild(d); });
  if ((P.fundo || []).length > 1) { let k = 0; setInterval(() => { const all = $('slides').children; all[k].classList.remove('on'); k = (k + 1) % all.length; all[k].classList.add('on'); }, 8000); }
  $('wallName').textContent = (P.aniversariante || P.nome); $('wallName').dataset.txt = $('wallName').textContent;
  if (P.idade) $('wallAge').textContent = P.idade; else document.querySelector('h1 .age').style.display = 'none';
  $('ticker').textContent = ([`${(P.aniversariante || '').toUpperCase()} FAZ ${P.idade || ''}`, 'POP STAR PARTY', 'ESCANEIE O QR CODE', 'TIRE SUA FOTO', 'DEIXE UM RECADO', 'APAREÇA NO TELÃO'].join(' ✦ ') + ' ✦ ').repeat(6);

  let photos = [];            // todas, mais nova primeiro
  let shown = [];             // ids exibidos no mural, na ordem dos cards
  let slots = 12, cols = 4;
  const queue = []; let spotlightBusy = false;

  // Calcula quantas fotos cabem no mural sem rolagem
  function layout() {
    const wall = $('wall');
    const W = wall.clientWidth, H = wall.clientHeight;
    const gap = window.innerWidth * 0.014;
    let best = { c: 1, r: 1, cw: 0, score: -1 };
    const want = Math.max(photos.length, 1);
    for (let c = 1; c <= 9; c++) {
      for (let r = 1; r <= 5; r++) {
        // maior card que cabe na largura e na altura
        const cw = Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r / 1.5);
        if (cw < 60) continue;
        // prioriza mostrar todas as fotos; depois, cards maiores
        const score = Math.min(c * r, want) * 100000 + cw;
        if (score > best.score) best = { c, r, cw, score };
      }
    }
    cols = best.c; slots = best.c * best.r;
    wall.style.gridTemplateColumns = `repeat(${cols}, ${best.cw}px)`;
  }

  const rot = () => `${(Math.random() * 5 - 2.5).toFixed(2)}deg`;
  const isVid = (p) => p && p.type === 'video';
  const imgUrl = (p) => (isVid(p) ? p.poster : p.url);

  function cardEl(p, cls) {
    const d = document.createElement('div');
    d.className = 'card ' + (cls || '');
    d.dataset.id = p.id;
    d.style.setProperty('--rot', rot());
    const img = new Image(); img.src = imgUrl(p); img.alt = p.name || 'Participante';
    d.appendChild(img);
    if (isVid(p)) { d.classList.add('video'); const pl = document.createElement('div'); pl.className = 'play'; d.appendChild(pl); }
    if (p.message) { const m = document.createElement('div'); m.className = 'msg'; m.textContent = `“${p.message}”`; d.appendChild(m); }
    return d;
  }

  function render() {
    layout();
    const wall = $('wall');
    wall.innerHTML = '';
    $('count').textContent = photos.length;
    if (!photos.length) {
      wall.innerHTML = `<div class="empty">${(P.artes && P.artes.grupo) ? `<img class="art" src="${P.artes.grupo}" alt="">` : `<div class="bot">${window.PainelFrame.discoSVG()}</div>`}<div class="copy"><small>✦ ${escapeHtml(P.moldura && P.moldura.linha1 || 'Pop Star Party')} ✦</small><div class="big">Seja o primeiro a aparecer aqui!</div><p>Escaneie o QR Code ao lado e tire sua foto 📸</p></div></div>`;
      shown = [];
      return;
    }
    shown = photos.slice(0, slots).map((p) => p.id);
    shown.forEach((id) => wall.appendChild(cardEl(photos.find((p) => p.id === id))));
  }

  function addToWall(p) {
    const wall = $('wall');
    if (photos.length === 1 || wall.querySelector('.empty')) return render();
    layout();
    wall.prepend(cardEl(p, 'enter'));
    shown.unshift(p.id);
    while (shown.length > slots) { shown.pop(); wall.lastElementChild.remove(); }
  }

  // Quando há mais fotos que espaço, troca uma foto antiga de tempos em tempos
  setInterval(() => {
    if (spotlightBusy || photos.length <= slots) return;
    const hidden = photos.filter((p) => !shown.includes(p.id));
    if (!hidden.length) return;
    const p = hidden[Math.floor(Math.random() * hidden.length)];
    const idx = 3 + Math.floor(Math.random() * Math.max(1, shown.length - 3)); // preserva as 3 mais recentes
    const card = $('wall').children[idx];
    if (!card) return;
    const img = new Image();
    img.onload = () => {
      card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap');
      card.replaceChildren(...cardEl(p).childNodes); card.dataset.id = p.id; shown[idx] = p.id;
      card.classList.toggle('video', isVid(p));
    };
    img.src = imgUrl(p); img.alt = p.name || 'Participante';
  }, 5000);

  // ---------- Player único de vídeo (reaproveitado; libera memória ao terminar) ----------
  const VCFG = Object.assign({ somNoTelao: true }, P.video || {});
  let soundOn = false;
  const player = document.createElement('video');
  player.className = 'tv'; player.playsInline = true; player.setAttribute('playsinline', ''); player.preload = 'auto';
  let vDone = null, vTimer = null, vImg = null;
  function stopVideo() {
    clearTimeout(vTimer);
    player.onended = player.onerror = player.onplaying = null;
    try { player.pause(); } catch {}
    player.removeAttribute('src'); player.load();
    if (player.parentNode) player.remove();
    if (vImg) { vImg.style.display = ''; vImg = null; }
    const cb = vDone; vDone = null; return cb;
  }
  // Toca o vídeo no lugar da imagem "img"; chama onEnd ao terminar, falhar ou travar
  function playVideo(img, p, onEnd) {
    stopVideo();
    vDone = onEnd; vImg = img;
    const finish = () => { const cb = stopVideo(); if (cb) cb(); };
    player.muted = !(VCFG.somNoTelao && soundOn);
    player.src = p.url;
    img.insertAdjacentElement('afterend', player);
    img.style.display = 'none';
    player.onended = finish;
    player.onerror = finish;
    // trava de segurança: duração + folga, no máximo 25 s
    vTimer = setTimeout(finish, Math.min(25, (Number(p.duration) || 15) + 6) * 1000);
    player.play().catch(() => { player.muted = true; player.play().catch(finish); });
  }

  // Destaque de nova foto
  function spotlight(p) {
    queue.push(p);
    stopShowcase();
    if (!spotlightBusy) nextSpot();
  }
  function nextSpot() {
    const p = queue.shift();
    if (!p) { spotlightBusy = false; scheduleShowcase(); return; }
    spotlightBusy = true;
    const img = $('spotImg');
    img.onload = () => {
      $('spotName').innerHTML = p.name ? `Olá, <span>${escapeHtml(p.name)}</span>!` : 'Mais um <span>participante!</span>';
      $('spotMsg').textContent = p.message ? `“${p.message}”` : '';
      $('spot').querySelector('small').textContent = isVid(p) ? 'Novo vídeo no mural' : 'Nova foto no mural';
      img.classList.toggle('is-video', isVid(p));
      $('spot').classList.add('on');
      celebrate();
      const close = () => {
        $('spot').classList.remove('on');
        addToWall(p);
        setTimeout(nextSpot, 900);
      };
      if (isVid(p)) setTimeout(() => playVideo(img, p, close), 1200);
      else setTimeout(close, p.message ? 8000 : 6000);
    };
    img.onerror = () => { addToWall(p); nextSpot(); };
    img.src = imgUrl(p);
  }
  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Confete nas cores do tema
  const cv = $('confetti'), cx = cv.getContext('2d');
  let parts = [], raf = null;
  function burst() {
    if (cv.width !== innerWidth || cv.height !== innerHeight) { cv.width = innerWidth; cv.height = innerHeight; }
    const K = window.PAINEL.cores; const colors = [K.destaque, K.destaqueClaro, '#FFD27A', '#FFFFFF', K.destaqueEscuro];
    for (let i = 0; i < 220; i++) {
      parts.push({
        x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .3, y: innerHeight * .55,
        vx: (Math.random() - .5) * 22, vy: -Math.random() * 24 - 8, r: Math.random() * 8 + 5,
        a: Math.random() * 6, va: (Math.random() - .5) * .4, c: colors[i % colors.length], life: 0,
      });
    }
    if (!raf) tick();
  }
  function tick() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter((p) => p.y < cv.height + 40 && p.life < (p.fw ? 75 : 260));
    for (const p of parts) {
      if (p.fw) {
        p.vy += .08; p.vx *= .97; p.vy *= .97; p.x += p.vx; p.y += p.vy; p.life++;
        cx.globalAlpha = Math.max(0, 1 - p.life / 75); cx.fillStyle = p.c;
        cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); cx.globalAlpha = 1;
        continue;
      }
      p.vy += .5; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life++;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c;
      cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cv.width, cv.height), null);
  }

  // ---------- Fogos de artifício ----------
  function fireworks() {
    const K = window.PAINEL.cores; const colors = [K.destaqueClaro, '#FFD27A', '#FF8FB1', '#7EE0C3', '#FFFFFF'];
    for (let n = 0; n < 6; n++) {
      setTimeout(() => {
        cv.width = cv.width || innerWidth; cv.height = cv.height || innerHeight;
        const x = innerWidth * (0.12 + Math.random() * 0.76), y = innerHeight * (0.12 + Math.random() * 0.35);
        const c = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 80; i++) {
          const a = (Math.PI * 2 * i) / 80, sp = 4 + Math.random() * 7;
          parts.push({ fw: true, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3 + Math.random() * 3, c, life: 0 });
        }
        sfx.pop();
        if (!raf) tick();
      }, 350 + n * 520);
    }
  }
  function celebrate() { burst(); fireworks(); sfx.fanfare(); }

  // ---------- Som (gerado no navegador; dá para trocar por um arquivo em config.js) ----------
  const sfx = (() => {
    let ac = null, enabled = false;
    const custom = window.PAINEL.somComemoracao ? new Audio(window.PAINEL.somComemoracao) : null;
    function enable() {
      enabled = true;
      try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch {}
      if (custom) { custom.volume = 0.0001; custom.play().then(() => { custom.pause(); custom.currentTime = 0; custom.volume = 1; }).catch(() => {}); }
    }
    function note(freq, t, dur, type = 'triangle', vol = 0.18) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
    }
    function fanfare() {
      if (!enabled) return;
      if (custom) { custom.currentTime = 0; custom.play().catch(() => {}); return; }
      if (!ac) return;
      const t = ac.currentTime + 0.05, C5 = 523.25, E5 = 659.25, G5 = 783.99, C6 = 1046.5, A5 = 880, F5 = 698.46;
      [[C5, 0], [E5, .14], [G5, .28], [C6, .42]].forEach(([f, d]) => note(f, t + d, .22, 'square', .07));
      [[G5, .7], [A5, .82], [G5, .94], [F5, 1.06], [E5, 1.18], [G5, 1.3]].forEach(([f, d]) => note(f, t + d, .16, 'triangle', .16));
      [C5, E5, G5, C6].forEach((f) => note(f, t + 1.5, 1.4, 'triangle', .1));
      [C5 / 2, G5 / 2].forEach((f) => note(f, t + 1.5, 1.4, 'sine', .14));
    }
    function pop() {
      if (!enabled || !ac || custom) return;
      const len = ac.sampleRate * 0.35, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 1400; g.gain.value = 0.35;
      src.buffer = buf; src.connect(f).connect(g).connect(ac.destination); src.start();
    }
    return { enable, fanfare, pop };
  })();
  function unlockSound() { sfx.enable(); soundOn = true; $('soundBtn').classList.add('hide'); sfx.fanfare(); }
  $('soundBtn').onclick = (e) => { e.stopPropagation(); unlockSound(); };
  addEventListener('keydown', (e) => { if (e.key !== 'f' && e.key !== 'F' && !$('soundBtn').classList.contains('hide')) unlockSound(); });

  // ---------- Vitrine (carrossel das fotos antigas) ----------
  const WAIT = (window.PAINEL.carrosselEsperaSegundos ?? 20) * 1000, EACH = (window.PAINEL.carrosselTrocaSegundos ?? 7) * 1000;
  let idleT = null, showT = null, showing = false, lastShown = null;
  function scheduleShowcase() {
    clearTimeout(idleT);
    if (WAIT <= 0) return;
    idleT = setTimeout(startShowcase, WAIT);
  }
  function startShowcase() {
    if (spotlightBusy || !photos.length) return scheduleShowcase();
    showing = true; nextShow(true);
  }
  // Artes que aparecem de vez em quando na vitrine, entre as fotos dos convidados
  const ART_SLIDES = [
    ['grupo', 'Pop Star Party', `${P.aniversariante || ''} faz ${P.idade || ''}!`],
    ['aniversariante', 'A aniversariante', P.aniversariante || ''],
    ['dupla', 'Hoje é dia de brilhar', `${P.aniversariante || ''} ✦ ${P.idade || ''} anos`],
  ].filter(([k]) => (P.artes || {})[k]).map(([k, kicker, title]) => ({ id: 'art-' + k, url: P.artes[k], kicker, title, art: true }));
  let showCount = 0, artIdx = 0;
  function nextShow(first) {
    if (!showing) return;
    showCount++;
    let p;
    if (ART_SLIDES.length && showCount % 4 === 0) { p = ART_SLIDES[artIdx++ % ART_SLIDES.length]; }
    else {
      const pool = photos.length > 1 ? photos.filter((x) => x.id !== lastShown) : photos;
      p = pool[Math.floor(Math.random() * pool.length)];
    }
    if (!p) return stopShowcase();
    if (!first && p.id === lastShown) { showT = setTimeout(() => nextShow(false), EACH); return; }
    lastShown = p.id;
    const img = $('showImg'), txt = $('showText');
    img.classList.add('out'); txt.classList.add('out');
    setTimeout(() => {
      const pre = new Image();
      pre.onload = () => {
        if (!showing) return;
        img.src = imgUrl(p);
        img.classList.toggle('is-video', isVid(p));
        if (p.art) {
          $('showText').querySelector('small').textContent = `✦ ${p.kicker} ✦`;
          $('showName').innerHTML = `<span>${escapeHtml(p.title)}</span>`;
          $('showMsg').textContent = '';
        } else {
          $('showText').querySelector('small').textContent = 'Relembrando 💜';
          $('showName').innerHTML = p.name ? `<span>${escapeHtml(p.name)}</span>` : 'Um convidado';
          $('showMsg').textContent = p.message ? `“${p.message}”` : '';
        }
        $('showcase').classList.add('on');
        img.classList.remove('out'); txt.classList.remove('out');
        if (isVid(p)) {
          $('showText').querySelector('small').textContent = 'Vídeo 🎬';
          showT = setTimeout(() => playVideo(img, p, () => { if (showing) nextShow(false); }), 600);
        } else showT = setTimeout(() => nextShow(false), EACH);
      };
      pre.onerror = () => { showT = setTimeout(() => nextShow(false), 500); };
      pre.src = imgUrl(p);
    }, first ? 0 : 700);
  }
  function stopShowcase() {
    if (vImg === $('showImg')) stopVideo();
    showing = false; clearTimeout(showT); clearTimeout(idleT);
    $('showcase').classList.remove('on');
  }

  // Dados + tempo real
  async function load() {
    const [info, list] = await Promise.all([
      fetch('/api/info').then((r) => r.json()),
      fetch('/api/photos').then((r) => r.json()),
    ]);
    $('url').textContent = info.captureUrl.replace(/^https?:\/\//, '');
    $('qr').innerHTML = '';
    new QRCode($('qr'), { text: info.captureUrl, width: 512, height: 512, colorDark: '#1E1B2E', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M });
    photos = list.slice().reverse();
    render();
    scheduleShowcase();
  }

  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => $('live').classList.remove('off');
    es.onerror = () => $('live').classList.add('off');
    es.addEventListener('photo', (e) => {
      const p = JSON.parse(e.data);
      if (photos.some((x) => x.id === p.id)) return;
      photos.unshift(p);
      $('count').textContent = photos.length;
      spotlight(p);
    });
    es.addEventListener('remove', (e) => {
      const { id } = JSON.parse(e.data);
      photos = photos.filter((p) => p.id !== id);
      if (lastShown === id && showing) { if (vImg === $('showImg')) stopVideo(); clearTimeout(showT); nextShow(false); }
      render();
    });
    es.addEventListener('reset', () => { photos = []; stopShowcase(); stopVideo(); render(); });
  }

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 200); });

  // Mostrar/esconder a lateral do QR Code (clique no botão da direita ou tecla Q). A escolha fica salva.
  function setSide(hidden) {
    $('app').classList.toggle('no-side', hidden);
    $('sideBtn').textContent = hidden ? '◀ QR Code' : 'Esconder ▶';
    try { localStorage.setItem('mural-sem-qr', hidden ? '1' : ''); } catch {}
    clearTimeout(rt); rt = setTimeout(render, 480);
  }
  let startHidden = false; try { startHidden = localStorage.getItem('mural-sem-qr') === '1'; } catch {}
  setSide(startHidden);
  $('sideBtn').onclick = (e) => { e.stopPropagation(); setSide(!$('app').classList.contains('no-side')); };
  addEventListener('keydown', (e) => { if (e.key === 'q' || e.key === 'Q') setSide(!$('app').classList.contains('no-side')); });
  const fs = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  $('fs').onclick = fs;
  addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') fs(); });

  // Celular (tela de toque estreita): galeria com rolagem. No computador, o telão segue igual.
  const MOBILE = matchMedia('(pointer: coarse) and (max-width: 1000px)').matches;
  if (MOBILE) return startMobile();
  load().then(connect).catch((e) => { console.error(e); setTimeout(() => location.reload(), 5000); });

  function startMobile() {
    document.body.classList.add('m');
    $('mDisco').innerHTML = window.PainelFrame.discoSVG();
    $('mTitle').textContent = `${P.aniversariante || P.nome}${P.idade ? ' faz ' + P.idade : ''}`;
    $('mSub').textContent = (P.moldura && P.moldura.linha1) || 'Pop Star Party';
    let list = [], cur = -1;
    const thumb = (p) => (isVid(p) ? p.poster : p.url);
    function item(p, fresh) {
      const b = document.createElement('button');
      b.className = 'mitem' + (isVid(p) ? ' video' : '') + (fresh ? ' new' : '');
      b.dataset.id = p.id;
      b.innerHTML = `<img loading="lazy" alt="" src="${thumb(p)}">${isVid(p) ? '<span class="mplay"></span>' : ''}${p.name ? `<span class="mname">${escapeHtml(p.name)}</span>` : ''}`;
      b.onclick = () => open(list.findIndex((x) => x.id === p.id));
      return b;
    }
    function renderAll() {
      $('mCount').textContent = list.length;
      const g = $('mGrid'); g.innerHTML = '';
      if (!list.length) {
        g.style.display = 'block';
        g.innerHTML = `<div class="mempty">${ARTES.grupo ? `<img src="${ARTES.grupo}" alt="">` : ''}<b>O mural ainda está vazio</b>As fotos e vídeos da festa vão aparecer aqui.</div>`;
        return;
      }
      g.style.display = '';
      list.forEach((p) => g.appendChild(item(p)));
    }
    function stopMedia() { const v = $('mMedia').querySelector('video'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); } $('mMedia').innerHTML = ''; }
    function open(i) {
      if (i < 0 || i >= list.length) return;
      cur = i; const p = list[i];
      stopMedia();
      if (isVid(p)) {
        const v = document.createElement('video');
        v.controls = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'metadata'; v.poster = p.poster; v.src = p.url;
        $('mMedia').appendChild(v); v.play().catch(() => {});
      } else { const im = new Image(); im.src = p.url; im.alt = ''; $('mMedia').appendChild(im); }
      $('mName').textContent = p.name || '';
      $('mMsg').textContent = p.message ? `“${p.message}”` : '';
      $('mPrev').style.visibility = i > 0 ? '' : 'hidden';
      $('mNext').style.visibility = i < list.length - 1 ? '' : 'hidden';
      $('mView').classList.add('on'); document.body.style.overflow = 'hidden';
    }
    function close() { stopMedia(); cur = -1; $('mView').classList.remove('on'); document.body.style.overflow = ''; }
    $('mClose').onclick = close;
    $('mPrev').onclick = () => open(cur - 1);
    $('mNext').onclick = () => open(cur + 1);
    $('mView').onclick = (e) => { if (e.target === $('mView') || e.target === $('mMedia')) close(); };
    // deslizar para os lados troca de foto
    let sx = null;
    $('mView').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
    $('mView').addEventListener('touchend', (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 60) open(cur + (dx < 0 ? 1 : -1)); }, { passive: true });

    fetch('/api/photos').then((r) => r.json()).then((l) => { list = l.slice().reverse(); renderAll(); }).catch(() => setTimeout(() => location.reload(), 5000));
    const es = new EventSource('/events');
    es.addEventListener('photo', (e) => {
      const p = JSON.parse(e.data);
      if (list.some((x) => x.id === p.id)) return;
      list.unshift(p);
      if (list.length === 1) return renderAll();
      $('mCount').textContent = list.length;
      $('mGrid').prepend(item(p, true));
      if (cur >= 0) cur++;
    });
    es.addEventListener('remove', (e) => {
      const { id } = JSON.parse(e.data);
      const i = list.findIndex((x) => x.id === id); if (i < 0) return;
      if (i === cur) close();
      list.splice(i, 1); if (cur > i) cur--;
      renderAll();
    });
    es.addEventListener('reset', () => { close(); list = []; renderAll(); });
  }
})();
</script>
</body>
</html>
