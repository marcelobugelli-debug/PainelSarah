<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="var(--accent)">
<title>Mural · Sua foto no telão</title>
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Monoton&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #FF2E93; --accent-2: #C8A2FF; --accent-deep: #7B2CBF;
    --fg: #FFFFFF; --bg: #0A0612; --panel: #170D24; --panel-2: #22133A; --line: #3A2557;
    --muted: #B9A9D6; --pink-soft: #FF8AD0; --cream: var(--bg);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    color: var(--fg);
    background: var(--bg);
    background-image:
      radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--accent-deep) 55%, transparent) 0, transparent 60%),
      radial-gradient(80% 50% at 100% 100%, color-mix(in srgb, var(--accent) 25%, transparent) 0, transparent 60%);
    background-attachment: fixed;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  .screen { display: none; position: relative; min-height: 100dvh; padding: max(18px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); flex-direction: column; align-items: center; }
  .screen.active { display: flex; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .brand { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: .14em; font-size: 15px; color: #fff; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
  .brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }

  /* ================= HOME: balada ================= */
  #welcome { overflow: hidden; padding-left: 0; padding-right: 0; justify-content: space-between; }
  .slides { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .slides .slide { position: absolute; inset: 0; background-size: cover; background-position: center 18%; opacity: 0; transform: scale(1.06); transition: opacity 1.6s ease, transform 7s ease; }
  .slides .slide.on { opacity: 1; transform: scale(1); }
  .slides::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, #0A0612cc 0%, #0A061266 28%, #0A061299 55%, #0A0612f2 82%); }
  .club { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .beam { position: absolute; top: -10%; width: 38vw; max-width: 220px; height: 120%; transform-origin: 50% 0; filter: blur(2px); opacity: .55; mix-blend-mode: screen; }
  .beam.b1 { left: 2%; background: linear-gradient(to bottom, var(--accent), transparent 75%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); animation: sweep 6s ease-in-out infinite alternate; }
  .beam.b2 { right: 2%; background: linear-gradient(to bottom, var(--accent-2), transparent 75%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); animation: sweep 7s ease-in-out infinite alternate-reverse; }
  .beam.b3 { left: 40%; background: linear-gradient(to bottom, #fff, transparent 60%); clip-path: polygon(46% 0, 54% 0, 80% 100%, 20% 100%); opacity: .18; animation: sweep 9s ease-in-out infinite alternate; }
  @keyframes sweep { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(#ffffff2e 1.2px, transparent 1.4px); background-size: 26px 26px; mask-image: linear-gradient(to bottom, #000, transparent 70%); }
  .floor { position: absolute; left: -10%; right: -10%; bottom: -8%; height: 40%; background: radial-gradient(60% 70% at 50% 100%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 70%); }
  .spark { position: absolute; width: 14px; height: 14px; background: #fff; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { transform: scale(.4); opacity: .3; } 50% { transform: scale(1); opacity: 1; } }

  .ticker { position: relative; z-index: 2; width: 120%; margin-left: -10%; transform: rotate(-4deg); background: var(--accent); color: #fff; font-family: 'Anton', sans-serif; font-size: 18px; letter-spacing: .12em; padding: 8px 0; overflow: hidden; white-space: nowrap; box-shadow: 0 8px 30px -6px color-mix(in srgb, var(--accent) 70%, transparent); margin-top: 6px; }
  .ticker.alt { background: #fff; color: var(--bg); transform: rotate(3deg); margin-top: -22px; z-index: 1; opacity: .95; }
  .ticker-track { display: inline-block; animation: marquee 18s linear infinite; }
  .ticker.alt .ticker-track { animation-direction: reverse; animation-duration: 22s; }
  @keyframes marquee { to { transform: translateX(-50%); } }

  .hero { position: relative; z-index: 2; width: 100%; max-width: 440px; padding: 0 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; margin: 10px 0; }
  .disco { width: 108px; height: 132px; margin-top: -6px; filter: drop-shadow(0 0 24px color-mix(in srgb, var(--accent-2) 70%, transparent)); animation: swing 4s ease-in-out infinite; transform-origin: 50% 0; }
  .disco svg { width: 100%; height: 100%; display: block; }
  .disco.avatar { width: 128px; height: 128px; margin-top: 0; border-radius: 50%; padding: 5px; background: conic-gradient(from 200deg, var(--accent), var(--accent-2), #fff, var(--accent)); animation: none; box-shadow: 0 0 40px -4px var(--accent); }
  .disco.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 4px solid var(--bg); }
  @keyframes swing { 50% { transform: rotate(6deg); } }
  .kicker { margin: 0; display: inline-flex; gap: 8px; align-items: center; font-weight: 800; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: var(--accent-2); border: 1.5px solid color-mix(in srgb, var(--accent-2) 60%, transparent); padding: 7px 14px; border-radius: 99px; background: #0A061299; backdrop-filter: blur(6px); }
  .mega { margin: 0; line-height: .86; font-weight: 400; display: flex; flex-direction: column; align-items: center; }
  .mega .name { font-family: 'Anton', sans-serif; font-size: clamp(76px, 26vw, 140px); letter-spacing: .02em; max-width: 100%; text-transform: uppercase; color: transparent; -webkit-text-stroke: 2.5px #fff; text-shadow: 0 0 30px color-mix(in srgb, var(--accent) 55%, transparent); position: relative; }
  .mega .name::after { content: attr(data-txt); position: absolute; inset: 0; color: #fff; clip-path: inset(52% 0 0 0); -webkit-text-stroke: 0; background: linear-gradient(90deg, var(--accent), var(--pink-soft), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mega .age { display: flex; align-items: center; gap: 10px; font-family: 'Anton', sans-serif; font-size: clamp(30px, 10vw, 46px); letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
  .mega .age b { font-family: 'Monoton', cursive; font-weight: 400; font-size: 1.8em; line-height: 1; color: #fff; text-shadow: 0 0 6px #fff, 0 0 18px var(--accent), 0 0 38px var(--accent), 0 0 70px var(--accent); animation: flicker 5s infinite; }
  @keyframes flicker { 0%, 18%, 22%, 60%, 64%, 100% { opacity: 1; } 20%, 62% { opacity: .55; } }
  .tagline { margin: 2px 0 0; font-family: 'Anton', sans-serif; font-size: 20px; letter-spacing: .3em; color: #fff; text-transform: uppercase; }
  .tagline span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 16px; margin: 0; line-height: 1.4; max-width: 330px; }

  .glass { width: 100%; background: color-mix(in srgb, var(--panel) 80%, transparent); border: 1px solid var(--line); border-radius: 22px; padding: 14px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 12px; }
  label.field { text-align: left; display: block; font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); }
  input[type=text] {
    width: 100%; margin-top: 8px; padding: 15px 16px; font: inherit; font-size: 18px; font-weight: 600; color: #fff;
    border: 1.5px solid var(--line); border-radius: 14px; background: #0A0612; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input[type=text]::placeholder, textarea::placeholder { color: #7D6E99; }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }

  .btn {
    appearance: none; border: 0; font: inherit; font-weight: 800; font-size: 17px; cursor: pointer; letter-spacing: .04em;
    padding: 16px 22px; border-radius: 999px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .12s ease, box-shadow .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { color: #fff; background: linear-gradient(100deg, var(--accent) 0%, #FF5FB7 50%, var(--accent-deep) 100%); box-shadow: 0 0 0 1px #ffffff33 inset, 0 10px 30px -8px color-mix(in srgb, var(--accent) 85%, transparent), 0 0 24px -4px color-mix(in srgb, var(--accent) 60%, transparent); text-transform: uppercase; }
  .btn-ghost { background: transparent; color: #fff; border: 1.5px solid var(--line); }
  .btn[disabled] { opacity: .6; pointer-events: none; }
  .btn svg { width: 22px; height: 22px; }
  .cta-big { font-family: 'Anton', sans-serif; font-weight: 400; font-size: clamp(17px, 5.4vw, 22px); letter-spacing: .08em; padding: 17px 18px; white-space: nowrap; }
  @media (max-height: 740px) {
    #welcome .hero { gap: 9px; margin: 4px 0; }
    .disco { width: 70px; height: 86px; }
    .disco.avatar { width: 92px; height: 92px; }
    .mega .name { font-size: clamp(64px, 22vw, 110px); }
    .mega .age { font-size: clamp(24px, 8vw, 36px); margin-top: 2px; }
    .sub { font-size: 14px; }
    .glass { padding: 12px; gap: 10px; }
    input[type=text] { padding: 12px 14px; margin-top: 6px; }
    .ticker.alt, .foot-note { display: none; }
  }
  .foot-note { position: relative; z-index: 2; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: #ffffff66; margin: 4px 0 0; }

  /* ================= Escolha da moldura ================= */
  .frames { width: 100%; max-width: 460px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0 4px; }
  .frame-opt { appearance: none; border: 2px solid var(--line); background: var(--panel); border-radius: 18px; padding: 8px; cursor: pointer; font: inherit; font-weight: 700; color: #fff; display: flex; flex-direction: column; gap: 6px; align-items: center; transition: border-color .2s, box-shadow .2s; }
  .frame-opt img { width: 100%; aspect-ratio: 2 / 3; border-radius: 10px; display: block; }
  .frame-opt.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent), 0 0 30px -6px var(--accent); }
  .page-title { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 34px; letter-spacing: .04em; text-transform: uppercase; margin: 12px 0 0; text-align: center; line-height: 1; }
  .page-title span { color: var(--accent); }
  .sticky-actions { position: sticky; bottom: 0; z-index: 3; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding: 14px 0 max(10px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
  .sticky-actions.row { flex-direction: row; }

  /* ================= Câmera ================= */
  #camera { background: #000; color: #fff; padding-left: 0; padding-right: 0; height: 100dvh; min-height: 0; overflow: hidden; padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .stage-box { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; padding: 10px 12px 0; }
  .stage { position: relative; height: min(100%, calc((100vw - 24px) * 1.5)); aspect-ratio: 2 / 3; flex: none; border-radius: 18px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px #ffffff1a, 0 20px 50px -10px color-mix(in srgb, var(--accent) 50%, transparent); }
  .stage video { position: absolute; object-fit: cover; }
  .stage video.mirror { transform: scaleX(-1); }
  .stage img.frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .stage canvas.fx { position: absolute; pointer-events: none; }
  .stage canvas.fx.mirror { transform: scaleX(-1); }
  .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Anton', sans-serif; font-size: 150px; color: #fff; text-shadow: 0 0 30px var(--accent); pointer-events: none; }
  .count.pop { animation: pop .9s ease forwards; }
  @keyframes pop { from { transform: scale(1.6); opacity: 0; } 30% { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.8); } }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash .5s ease; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  .chips { flex: none; display: flex; gap: 8px; overflow-x: auto; width: 100%; max-width: 460px; padding: 12px 16px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid #ffffff22; border-radius: 999px; padding: 6px 11px; background: #ffffff12; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .chip b { font-size: 18px; }
  .chip.sel { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 16px -2px var(--accent); }
  .fx-status { flex: none; font-size: 12px; color: var(--muted); min-height: 16px; margin-top: 4px; text-align: center; }
  .top-row { flex: none; display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 460px; padding: 0 16px; }
  .link-btn { border: 1px solid #ffffff22; background: #ffffff12; color: #fff; font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .controls { flex: none; display: flex; align-items: center; justify-content: space-around; width: 100%; max-width: 420px; padding: 6px 16px 0; }
  .round { width: 54px; height: 54px; border-radius: 50%; border: 1px solid #ffffff22; background: #ffffff14; color: #fff; display: grid; place-items: center; cursor: pointer; }
  .round svg { width: 26px; height: 26px; }
  .shutter { width: 74px; height: 74px; border-radius: 50%; border: 5px solid #fff; background: radial-gradient(circle, var(--accent) 0 58%, transparent 60%); cursor: pointer; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 30px var(--accent); transition: transform .1s; }
  .shutter:active { transform: scale(.92); }

  /* ================= Revisão / sucesso ================= */
  .result { width: 100%; max-width: 420px; flex: 1; display: flex; flex-direction: column; gap: 14px; justify-content: center; margin-top: 10px; }
  .result img.photo { width: 100%; border-radius: 16px; box-shadow: 0 0 0 1px #ffffff1a, 0 22px 44px -16px color-mix(in srgb, var(--accent) 60%, transparent); display: block; }
  .result h2 { margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 34px; letter-spacing: .03em; text-transform: uppercase; text-align: center; line-height: 1.05; }
  .result p { margin: 0; color: var(--muted); text-align: center; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; white-space: nowrap; font-size: 15px; padding: 16px 12px; }
  .spinner { width: 22px; height: 22px; border: 3px solid #fff6; border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check { width: 76px; height: 76px; margin: 0 auto; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); display: grid; place-items: center; box-shadow: 0 0 40px -4px var(--accent); animation: popin .5s cubic-bezier(.2,1.6,.4,1); }
  .check svg { width: 40px; height: 40px; }
  @keyframes popin { from { transform: scale(0); } to { transform: scale(1); } }
  .error { color: #FFD0D8; background: #5A1030; border: 1px solid #A0204F; border-radius: 12px; padding: 10px 14px; font-size: 15px; display: none; }
  .error.show { display: block; }
  #fileInput { display: none; }
  .photo-wrap { position: relative; width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
  .photo-wrap img.photo { width: 100%; }
  .sticker { position: absolute; transform: translate(-50%, -50%); line-height: 1; cursor: grab; touch-action: none; }
  .sticker.sel { outline: 2px dashed #fff; outline-offset: 4px; border-radius: 8px; filter: drop-shadow(0 0 6px var(--accent)); }
  .stickers { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
  .stickers::-webkit-scrollbar { display: none; }
  .stickers button { flex: none; width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-size: 26px; cursor: pointer; }
  .st-tools { display: none; gap: 8px; justify-content: center; }
  .st-tools.show { display: flex; }
  .st-tools button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; color: #fff; cursor: pointer; }
  .small-label { font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); }
  textarea { width: 100%; margin-top: 8px; padding: 14px 16px; font: inherit; font-size: 17px; color: #fff; border: 1.5px solid var(--line); border-radius: 14px; background: #0A0612; outline: none; resize: none; min-height: 84px; text-transform: none; letter-spacing: normal; font-weight: 500; }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  .counter-chars { text-align: right; font-size: 12px; color: var(--muted); margin-top: -8px; }
  .msg-done { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; font-style: italic; color: #fff; text-align: center; display: none; }
</style>
</head>
<body>

<!-- 1. Home -->
<section class="screen active" id="welcome">
  <div class="slides" id="slides" aria-hidden="true"></div>
  <div class="club" aria-hidden="true">
    <div class="dots"></div>
    <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
    <div class="floor"></div>
    <i class="spark" style="left:12%;top:22%"></i><i class="spark" style="left:84%;top:16%;animation-delay:.8s"></i>
    <i class="spark" style="left:76%;top:52%;animation-delay:1.4s;width:10px;height:10px"></i><i class="spark" style="left:8%;top:62%;animation-delay:.4s;width:9px;height:9px"></i>
  </div>

  <div class="ticker"><div class="ticker-track" id="tick1"></div></div>

  <div class="hero">
    <div class="disco" id="heroRobot"></div>
    <p class="kicker">✦ <span data-cfg="moldura.linha1">Pop Star Party</span> ✦</p>
    <h1 class="mega">
      <span class="name" id="heroName" data-cfg="aniversariante">Sarah</span>
      <span class="age">faz <b data-cfg="idade">11</b> anos</span>
    </h1>
    <p class="sub" data-cfg="chamada"></p>
    <div class="glass">
      <label class="field">Seu nome no telão
        <input type="text" id="name" maxlength="40" placeholder="Como quer aparecer?" autocomplete="given-name">
      </label>
      <button class="btn btn-primary cta-big" id="start">Bora tirar a foto ✦</button>
    </div>
    <div class="error" id="err1"></div>
  </div>

  <div class="ticker alt"><div class="ticker-track" id="tick2"></div></div>
  <p class="foot-note">foto · moldura · recado · telão</p>
</section>

<!-- 2. Moldura -->
<section class="screen" id="choose">
  <div class="brand"><i></i> <span data-cfg="nome">Mural de Fotos</span></div>
  <h2 class="page-title">Escolha sua <span>moldura</span></h2>
  <div class="frames" id="frames"></div>
  <div class="sticky-actions">
    <button class="btn btn-primary" id="openCam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Abrir câmera
    </button>
    <button class="btn btn-ghost" id="backWelcome">Voltar</button>
    <div class="error" id="err0"></div>
    <button class="btn btn-ghost" id="nativeCam" style="display:none">📷 Tirar pela câmera do celular</button>
  </div>
</section>

<!-- 3. Câmera -->
<section class="screen" id="camera">
  <div class="top-row">
    <div class="brand"><i></i> <span data-cfg="nome">Mural de Fotos</span></div>
    <button class="link-btn" id="changeFrame">Trocar moldura</button>
  </div>
  <div class="stage-box"><div class="stage" id="stage">
    <video id="video" playsinline autoplay muted class="mirror"></video>
    <canvas class="fx mirror" id="fx"></canvas>
    <img class="frame" id="frameOverlay" alt="">
    <div class="count" id="count"></div>
    <div class="flash" id="flash"></div>
  </div></div>
  <div class="chips" id="chips"></div>
  <div class="fx-status" id="fxStatus">Escolha um acessório (opcional)</div>
  <div class="controls">
    <button class="round" id="back" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="shutter" id="shoot" aria-label="Tirar foto"></button>
    <button class="round" id="flip" aria-label="Trocar câmera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9 13a3 3 0 0 1 5.2-2"/><path d="M15 13a3 3 0 0 1-5.2 2"/><path d="M14.5 8.8V11H12.3"/><path d="M9.5 17.2V15h2.2"/></svg></button>
  </div>
</section>

<!-- 4. Revisão -->
<section class="screen" id="review">
  <div class="brand"><i></i> <span data-cfg="nome">Mural de Fotos</span></div>
  <div class="result">
    <div class="photo-wrap" id="photoWrap"><img class="photo" id="preview" alt="Sua foto com a moldura" draggable="false"></div>
    <div>
      <div class="small-label">Figurinhas (toque para colocar, arraste para mover)</div>
      <div class="stickers" id="stickerBar"></div>
      <div class="st-tools" id="stTools">
        <button id="stSmaller">− Menor</button><button id="stBigger">+ Maior</button><button id="stRemove">🗑 Tirar</button>
      </div>
    </div>
    <label class="small-label">Deixe um recado (opcional)
      <textarea id="message" maxlength="140" placeholder="Escreva uma mensagem…"></textarea>
    </label>
    <div class="counter-chars"><span id="msgCount">0</span>/140</div>
    <div class="error" id="err2"></div>
    <div class="row sticky-actions">
      <button class="btn btn-ghost" id="retake">Tirar outra</button>
      <button class="btn btn-primary" id="send">Enviar ao telão</button>
    </div>
  </div>
</section>

<!-- 5. Sucesso -->
<section class="screen" id="done">
  <div class="brand"><i></i> <span data-cfg="nome">Mural de Fotos</span></div>
  <div class="result">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Pronto! Olhe para o telão 👀</h2>
    <p data-cfg="enviado"></p>
    <img class="photo" id="finalImg" alt="Sua foto">
    <div class="msg-done" id="msgDone"></div>
    <button class="btn btn-primary" id="save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      Salvar minha foto
    </button>
    <button class="btn btn-ghost" id="again">Tirar outra foto</button>
  </div>
</section>

<input type="file" id="fileInput" accept="image/*" capture="user">

<script src="/frame.js"></script>
<script src="/acessorios.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const F = window.PainelFrame, A = window.Acessorios;
  const dateText = new Date().toLocaleDateString('pt-BR');
  const STICKERS = (window.PAINEL.figurinhas || ['🎉', '🎂', '🥳', '💖', '⭐', '🌈', '🦄', '😂', '😎', '🔥', '👑', '🎈', '✨', '🐱', '🍕', '💜']);
  let stream = null, facing = 'user', busy = false, frameImg = null;
  let frameId = F.FRAMES[0].id, fxKind = 'nenhum', faces = [];
  let basePhoto = null, rawPhoto = null, finalPhoto = null;
  let stickers = [], selSticker = null;

  $('heroRobot').innerHTML = F.discoSVG();
  // Fotos da aniversariante girando no fundo da home
  const SLIDES = window.PAINEL.fundo || [];
  SLIDES.forEach((u, i) => { const d = document.createElement('div'); d.className = 'slide' + (i === 0 ? ' on' : ''); d.style.backgroundImage = `url("${u}")`; $('slides').appendChild(d); });
  if (SLIDES.length > 1) { let k = 0; setInterval(() => { const all = $('slides').children; all[k].classList.remove('on'); k = (k + 1) % all.length; all[k].classList.add('on'); }, 5500); }
  // Home: nome com efeito e faixas animadas
  const P = window.PAINEL;
  $('heroName').textContent = P.aniversariante || P.nome; $('heroName').dataset.txt = $('heroName').textContent;
  const tick = (P.faixa || ['Tire sua foto', 'Escolha a moldura', 'Apareça no telão', 'Deixe um recado']).map((t) => `${t} ✦ `).join('');
  $('tick1').textContent = tick.repeat(6);
  $('tick2').textContent = (`${(P.aniversariante || '').toUpperCase()} FAZ ${P.idade || ''} ✦ POP STAR PARTY ✦ `).repeat(8);
  try { $('name').value = localStorage.getItem('mural-name') || ''; frameId = localStorage.getItem('mural-frame') || frameId; } catch {}
  if (!F.FRAMES.some((f) => f.id === frameId)) frameId = F.FRAMES[0].id;

  function show(id) {
    document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
  }
  function showErr(el, msg) { el.textContent = msg; el.classList.toggle('show', !!msg); }
  const getName = () => $('name').value.trim();
  const hole = () => F.byId(frameId).hole;

  // ---------- Molduras ----------
  const thumbs = {};
  let framePromise = null, frameKey = '';
  function warmFrame() {
    const key = frameId + '|' + getName();
    if (key !== frameKey) { frameKey = key; framePromise = F.frameImage(frameId, getName(), dateText); framePromise.catch(() => {}); }
    return framePromise;
  }
  function renderFrames() {
    $('frames').innerHTML = '';
    F.FRAMES.forEach((f) => {
      const b = document.createElement('button');
      b.className = 'frame-opt' + (f.id === frameId ? ' sel' : '');
      b.innerHTML = `<img alt=""><span>${f.nome}</span>`;
      const key = f.id + '|' + getName();
      (thumbs[key] = thumbs[key] || F.thumb(f.id, getName())).then((u) => { b.querySelector('img').src = u; }).catch(() => {});
      b.onclick = () => { frameId = f.id; try { localStorage.setItem('mural-frame', frameId); } catch {} renderFrames(); warmFrame(); };
      $('frames').appendChild(b);
    });
    warmFrame();
  }
  function placeVideo() {
    const h = hole();
    const box = { left: (h.x / F.W * 100) + '%', top: (h.y / F.H * 100) + '%', width: (h.w / F.W * 100) + '%', height: (h.h / F.H * 100) + '%' };
    Object.assign($('video').style, box);
    Object.assign($('fx').style, box);
  }
  let overlayKey = '';
  async function prepareFrame() {
    frameImg = await warmFrame();
    if (overlayKey !== frameKey) {
      overlayKey = frameKey;
      const blob = await new Promise((r) => frameImg.toBlob(r, 'image/png'));
      const old = $('frameOverlay').src; $('frameOverlay').src = URL.createObjectURL(blob);
      if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
    }
    placeVideo();
  }

  // ---------- Câmera ----------
  const liveCameraOk = () => window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  async function startCamera() {
    stopCamera();
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1920 } }, audio: false });
    const v = $('video');
    v.srcObject = stream;
    v.classList.toggle('mirror', facing === 'user');
    $('fx').classList.toggle('mirror', facing === 'user');
    await v.play().catch(() => {});
    loop();
  }
  function stopCamera() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }

  // ---------- Acessórios ao vivo ----------
  function renderChips() {
    $('chips').innerHTML = '';
    A.LISTA.forEach((a) => {
      const b = document.createElement('button');
      b.className = 'chip' + (a.id === fxKind ? ' sel' : '');
      b.innerHTML = `<b>${a.emoji}</b>${a.nome}`;
      b.onclick = () => chooseFx(a.id);
      $('chips').appendChild(b);
    });
  }
  async function chooseFx(id) {
    fxKind = id; renderChips();
    if (id === 'nenhum') { $('fxStatus').textContent = 'Escolha um acessório (opcional)'; return; }
    if (!A.pronto()) {
      $('fxStatus').textContent = 'Carregando acessórios…';
      try { await A.carregar(); } catch (e) {
        console.warn(e); fxKind = 'nenhum'; renderChips();
        $('fxStatus').textContent = 'Acessórios indisponíveis neste celular. Use as figurinhas depois da foto!';
        return;
      }
    }
    $('fxStatus').textContent = 'Funciona com várias pessoas na foto! 😄';
  }
  let raf = 0;
  function loop() {
    cancelAnimationFrame(raf);
    const v = $('video'), c = $('fx');
    const tick = () => {
      if (!stream) return;
      const cw = c.clientWidth, ch = c.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
      if (c.width !== Math.round(cw * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      if (fxKind !== 'nenhum' && A.pronto() && v.videoWidth) {
        faces = A.suavizar(A.detectar(v, v.videoWidth, v.videoHeight));
        const s = Math.max(c.width / v.videoWidth, c.height / v.videoHeight);
        const ox = (c.width - v.videoWidth * s) / 2, oy = (c.height - v.videoHeight * s) / 2;
        A.desenhar(ctx, faces, fxKind, (p) => ({ x: ox + p.x * s, y: oy + p.y * s }));
      } else faces = [];
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }

  // ---------- Montagem da foto ----------
  // Foto sem moldura (só a câmera), guardada para o download do administrador
  function rawImage(source, sw, sh, mirror) {
    const max = 1600, s = Math.min(1, max / Math.max(sw, sh));
    const c = document.createElement('canvas'); c.width = Math.round(sw * s); c.height = Math.round(sh * s);
    const ctx = c.getContext('2d');
    if (mirror) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(source, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.9);
  }
  // Foto com acessórios + moldura
  function compose(source, sw, sh, mirror, fx) {
    const c = document.createElement('canvas');
    c.width = F.W; c.height = F.H;
    const ctx = c.getContext('2d');
    const { x, y, w, h } = hole();
    const scale = Math.max(w / sw, h / sh);
    const dw = sw * scale, dh = sh * scale, ox = x + (w - dw) / 2, oy = y + (h - dh) / 2;
    ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h);
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    if (mirror) { ctx.translate(x + w / 2, 0); ctx.scale(-1, 1); ctx.translate(-(x + w / 2), 0); }
    ctx.drawImage(source, ox, oy, dw, dh);
    if (fx && fx.length) A.desenhar(ctx, fx, fxKind, (p) => ({ x: ox + p.x * scale, y: oy + p.y * scale }));
    ctx.restore();
    ctx.drawImage(frameImg, 0, 0, F.W, F.H);
    return c.toDataURL('image/jpeg', 0.88);
  }

  function goReview() {
    stickers = []; selSticker = null;
    $('preview').src = basePhoto;
    renderStickers();
    showErr($('err2'), '');
    show('review');
  }

  // ---------- Fluxo ----------
  $('start').onclick = async () => {
    try { localStorage.setItem('mural-name', getName()); } catch {}
    const btn = $('start'), txt = btn.textContent; btn.disabled = true; btn.textContent = 'Carregando…';
    await F.ready; btn.disabled = false; btn.textContent = txt;
    renderFrames(); show('choose');
  };
  $('backWelcome').onclick = () => show('welcome');
  function nativeCamera() { $('fileInput').value = ''; $('fileInput').click(); }
  $('openCam').onclick = async () => {
    showErr($('err0'), ''); $('nativeCam').style.display = 'none';
    // Sem câmera ao vivo: abre a câmera do celular na hora (precisa ser no mesmo toque)
    if (!liveCameraOk()) { prepareFrame().catch(() => {}); return nativeCamera(); }
    // Pede a câmera imediatamente e monta a moldura em paralelo
    const cam = startCamera();
    try { await prepareFrame(); } catch { stopCamera(); return showErr($('err0'), 'Não foi possível carregar a moldura. Recarregue a página.'); }
    try { await cam; renderChips(); show('camera'); }
    catch (e) {
      console.warn('Câmera ao vivo indisponível', e);
      showErr($('err0'), 'Não conseguimos abrir a câmera aqui. Libere a câmera para este site ou use o botão abaixo.');
      $('nativeCam').style.display = '';
    }
  };
  $('nativeCam').onclick = nativeCamera;
  $('changeFrame').onclick = () => { stopCamera(); renderFrames(); show('choose'); };

  // Alternativa: câmera nativa do celular
  $('fileInput').onchange = () => {
    const file = $('fileInput').files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      basePhoto = compose(img, img.naturalWidth, img.naturalHeight, false, []);
      rawPhoto = rawImage(img, img.naturalWidth, img.naturalHeight, false);
      URL.revokeObjectURL(url); goReview();
    };
    img.onerror = () => showErr($('err0'), 'Não consegui ler essa foto. Tente novamente.');
    img.src = url;
  };

  $('shoot').onclick = async () => {
    if (busy) return;
    busy = true;
    const el = $('count');
    for (const n of [3, 2, 1]) {
      el.textContent = n; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      await new Promise((r) => setTimeout(r, 900));
    }
    el.textContent = '';
    const fl = $('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
    const v = $('video');
    const mirror = facing === 'user';
    const fx = fxKind !== 'nenhum' && A.pronto() ? A.detectar(v, v.videoWidth, v.videoHeight) : [];
    basePhoto = compose(v, v.videoWidth, v.videoHeight, mirror, fx.length ? fx : faces);
    rawPhoto = rawImage(v, v.videoWidth, v.videoHeight, mirror);
    busy = false;
    stopCamera();
    goReview();
  };
  $('flip').onclick = async () => {
    facing = facing === 'user' ? 'environment' : 'user';
    try { await startCamera(); } catch { facing = 'user'; await startCamera().catch(() => {}); }
  };
  $('back').onclick = () => { stopCamera(); renderFrames(); show('choose'); };
  $('retake').onclick = async () => {
    if (!liveCameraOk()) return nativeCamera();
    try { await startCamera(); renderChips(); show('camera'); } catch { show('choose'); $('nativeCam').style.display = ''; }
  };

  // ---------- Figurinhas ----------
  STICKERS.forEach((e) => {
    const b = document.createElement('button'); b.textContent = e;
    b.onclick = () => { stickers.push({ e, x: 0.5, y: 0.45, s: 0.16 }); selSticker = stickers.length - 1; renderStickers(); };
    $('stickerBar').appendChild(b);
  });
  function renderStickers() {
    const wrap = $('photoWrap');
    wrap.querySelectorAll('.sticker').forEach((n) => n.remove());
    const W = wrap.clientWidth || 300;
    stickers.forEach((st, i) => {
      const d = document.createElement('div');
      d.className = 'sticker' + (i === selSticker ? ' sel' : '');
      d.textContent = st.e;
      d.style.left = st.x * 100 + '%'; d.style.top = st.y * 100 + '%'; d.style.fontSize = (st.s * W) + 'px';
      d.onpointerdown = (ev) => {
        ev.preventDefault(); selSticker = i; d.setPointerCapture(ev.pointerId);
        wrap.querySelectorAll('.sticker').forEach((n, j) => n.classList.toggle('sel', j === i));
        $('stTools').classList.add('show');
        const r = wrap.getBoundingClientRect();
        d.onpointermove = (m) => {
          st.x = Math.min(1, Math.max(0, (m.clientX - r.left) / r.width));
          st.y = Math.min(1, Math.max(0, (m.clientY - r.top) / r.height));
          d.style.left = st.x * 100 + '%'; d.style.top = st.y * 100 + '%';
        };
        d.onpointerup = () => { d.onpointermove = null; };
      };
      wrap.appendChild(d);
    });
    $('stTools').classList.toggle('show', selSticker != null && !!stickers[selSticker]);
  }
  window.addEventListener('resize', () => { if ($('review').classList.contains('active')) renderStickers(); });
  $('stBigger').onclick = () => { const s = stickers[selSticker]; if (s) { s.s = Math.min(0.6, s.s * 1.25); renderStickers(); } };
  $('stSmaller').onclick = () => { const s = stickers[selSticker]; if (s) { s.s = Math.max(0.05, s.s / 1.25); renderStickers(); } };
  $('stRemove').onclick = () => { if (stickers[selSticker]) { stickers.splice(selSticker, 1); selSticker = null; renderStickers(); } };

  // Junta foto + figurinhas numa imagem final
  function withStickers() {
    if (!stickers.length) return Promise.resolve(basePhoto);
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = F.W; c.height = F.H;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        stickers.forEach((st) => { ctx.font = `${Math.round(st.s * F.W)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.fillText(st.e, st.x * F.W, st.y * F.H); });
        resolve(c.toDataURL('image/jpeg', 0.88));
      };
      img.src = basePhoto;
    });
  }

  // ---------- Recado e envio ----------
  $('message').oninput = () => { $('msgCount').textContent = $('message').value.length; };
  $('send').onclick = async () => {
    const btn = $('send');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Enviando…';
    showErr($('err2'), '');
    try {
      finalPhoto = await withStickers();
      const message = $('message').value.trim();
      const r = await fetch('/api/photos', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: finalPhoto, raw: rawPhoto, name: getName(), message, frame: frameId }),
      });
      if (!r.ok) throw new Error();
      $('finalImg').src = finalPhoto;
      $('msgDone').textContent = message ? `“${message}”` : '';
      $('msgDone').style.display = message ? 'block' : 'none';
      $('message').value = ''; $('msgCount').textContent = '0';
      show('done');
    } catch {
      showErr($('err2'), 'Ops! Não conseguimos enviar. Verifique a conexão e tente de novo.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar ao telão';
    }
  };

  $('save').onclick = async () => {
    try {
      const blob = await (await fetch(finalPhoto)).blob();
      const file = new File([blob], window.PAINEL.arquivoFoto + '.jpg', { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Minha foto no ' + window.PAINEL.nome });
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = finalPhoto; a.download = window.PAINEL.arquivoFoto + '.jpg';
    document.body.appendChild(a); a.click(); a.remove();
  };
  $('again').onclick = () => { renderFrames(); show('choose'); };
  F.ready.then(() => { if ($('choose').classList.contains('active')) renderFrames(); });
})();
</script>
</body>
</html>
