<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<title>Mural · Sua foto no telão</title>
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #6C5CE7; --accent-2: #8E7CF0; --accent-deep: #4B3BC4;
    --ink: #1E1B2E; --cream: #F6F5FB; --muted: #6E6A85;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--cream);
    background-image:
      radial-gradient(circle at 10% -10%, #E3DEFB 0, transparent 45%),
      radial-gradient(circle at 110% 30%, #D4CCF7 0, transparent 40%);
    min-height: 100dvh;
    overflow-x: hidden;
  }
  .screen { display: none; min-height: 100dvh; padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); flex-direction: column; align-items: center; }
  .screen.active { display: flex; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .brand { font-weight: 900; letter-spacing: .08em; font-size: 15px; color: var(--accent-deep); display: flex; align-items: center; gap: 8px; }
  .brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px #DCD8F2; }

  /* Boas-vindas */
  .hero { flex: 1; width: 100%; max-width: 440px; display: flex; flex-direction: column; justify-content: center; gap: 22px; text-align: center; }
  .robot-wrap { width: 168px; height: 168px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle at 30% 25%, #FFFFFF, #E6E2FA 60%, #C9C0F5); display: grid; place-items: center; box-shadow: 0 18px 40px -14px #6C5CE799; }
  .robot-wrap svg { width: 128px; margin-top: 0; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg); } }
  h1 { font-size: clamp(30px, 9vw, 40px); line-height: 1.05; margin: 0; font-weight: 900; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 17px; margin: 0; line-height: 1.4; }
  label.field { text-align: left; display: block; font-weight: 600; font-size: 14px; color: var(--muted); }
  input[type=text] {
    width: 100%; margin-top: 6px; padding: 16px 18px; font: inherit; font-size: 18px; color: var(--ink);
    border: 2px solid #DCD8F2; border-radius: 16px; background: #fff; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px #6C5CE726; }

  .btn {
    appearance: none; border: 0; font: inherit; font-weight: 800; font-size: 18px; cursor: pointer;
    padding: 17px 22px; border-radius: 999px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .12s ease, box-shadow .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { color: #fff; background: linear-gradient(135deg, var(--accent-2), var(--accent-deep)); box-shadow: 0 12px 26px -10px #6C5CE7cc; }
  .btn-ghost { background: #fff; color: var(--ink); border: 2px solid #DCD8F2; }
  .btn[disabled] { opacity: .6; pointer-events: none; }
  .btn svg { width: 22px; height: 22px; }

  /* Câmera */
  #camera { background: #0E0C1A; color: #fff; padding-left: 0; padding-right: 0; }
  #camera .brand { color: #B8AEF5; }
  .stage { position: relative; width: min(100%, calc((100dvh - 200px) * 0.6667)); aspect-ratio: 2 / 3; margin: 14px auto 0; border-radius: 18px; overflow: hidden; background: #000; box-shadow: 0 20px 50px -10px #000; }
  .stage video { position: absolute; object-fit: cover; }
  .stage video.mirror { transform: scaleX(-1); }
  .stage img.frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 150px; font-weight: 900; color: #fff; text-shadow: 0 6px 30px #0008; pointer-events: none; }
  .count.pop { animation: pop .9s ease forwards; }
  @keyframes pop { from { transform: scale(1.6); opacity: 0; } 30% { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.8); } }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash .5s ease; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  .controls { display: flex; align-items: center; justify-content: space-around; width: 100%; max-width: 420px; margin-top: auto; padding: 18px 16px 0; }
  .round { width: 56px; height: 56px; border-radius: 50%; border: 0; background: #ffffff1f; color: #fff; display: grid; place-items: center; cursor: pointer; }
  .round svg { width: 26px; height: 26px; }
  .shutter { width: 84px; height: 84px; border-radius: 50%; border: 5px solid #fff; background: radial-gradient(circle, var(--accent-2) 0 58%, transparent 60%); cursor: pointer; box-shadow: 0 0 0 6px #6C5CE755; transition: transform .1s; }
  .shutter:active { transform: scale(.92); }
  .hint { font-size: 14px; color: #CFC8F5; margin-top: 10px; text-align: center; }

  /* Revisão / sucesso */
  .result { width: 100%; max-width: 420px; flex: 1; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
  .result img.photo { width: 100%; border-radius: 18px; box-shadow: 0 22px 44px -16px #3B2F8F88; display: block; }
  .result h2 { margin: 0; font-size: 28px; font-weight: 900; text-align: center; }
  .result p { margin: 0; color: var(--muted); text-align: center; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; white-space: nowrap; font-size: 16px; padding: 17px 14px; }
  .spinner { width: 22px; height: 22px; border: 3px solid #fff6; border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check { width: 76px; height: 76px; margin: 0 auto; border-radius: 50%; background: linear-gradient(135deg, var(--accent-2), var(--accent-deep)); display: grid; place-items: center; box-shadow: 0 12px 30px -8px #6C5CE7aa; animation: popin .5s cubic-bezier(.2,1.6,.4,1); }
  .check svg { width: 40px; height: 40px; }
  @keyframes popin { from { transform: scale(0); } to { transform: scale(1); } }
  .error { color: #B42318; background: #FFE5DC; border-radius: 12px; padding: 10px 14px; font-size: 15px; display: none; }
  .error.show { display: block; }
  #fileInput { display: none; }

  /* Escolha da moldura */
  .frames { width: 100%; max-width: 460px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0; }
  .frame-opt { appearance: none; border: 3px solid transparent; background: #fff; border-radius: 18px; padding: 8px; cursor: pointer; box-shadow: 0 10px 24px -14px #3B2F8F66; font: inherit; font-weight: 700; color: var(--ink); display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .frame-opt img { width: 100%; aspect-ratio: 2 / 3; border-radius: 10px; display: block; }
  .frame-opt.sel { border-color: var(--accent); box-shadow: 0 0 0 4px #6C5CE733, 0 10px 24px -14px #3B2F8F66; }
  .page-title { font-size: 26px; font-weight: 900; margin: 14px 0 0; text-align: center; }

  /* Acessórios na câmera */
  .stage canvas.fx { position: absolute; pointer-events: none; }
  .stage canvas.fx.mirror { transform: scaleX(-1); }
  .chips { display: flex; gap: 8px; overflow-x: auto; width: 100%; max-width: 460px; padding: 12px 16px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; border-radius: 999px; padding: 8px 12px; background: #ffffff1f; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .chip b { font-size: 20px; }
  .chip.sel { background: var(--accent); }
  .fx-status { font-size: 13px; color: #CFC8F5; min-height: 18px; margin-top: 6px; text-align: center; }
  .top-row { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 460px; padding: 0 16px; }
  .link-btn { border: 0; background: #ffffff1f; color: #fff; font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer; }

  /* Revisão: figurinhas e recado */
  .photo-wrap { position: relative; width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
  .photo-wrap img.photo { width: 100%; }
  .sticker { position: absolute; transform: translate(-50%, -50%); line-height: 1; cursor: grab; touch-action: none; }
  .sticker.sel { outline: 2px dashed #fff; outline-offset: 4px; border-radius: 8px; filter: drop-shadow(0 0 6px #6C5CE7); }
  .stickers { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .stickers::-webkit-scrollbar { display: none; }
  .stickers button { flex: none; width: 46px; height: 46px; border-radius: 14px; border: 2px solid #DCD8F2; background: #fff; font-size: 26px; cursor: pointer; }
  .st-tools { display: none; gap: 8px; justify-content: center; }
  .st-tools.show { display: flex; }
  .st-tools button { border: 2px solid #DCD8F2; background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; }
  .small-label { font-weight: 600; font-size: 14px; color: var(--muted); }
  textarea { width: 100%; margin-top: 6px; padding: 14px 16px; font: inherit; font-size: 17px; color: var(--ink); border: 2px solid #DCD8F2; border-radius: 16px; background: #fff; outline: none; resize: none; min-height: 84px; }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px #6C5CE726; }
  .counter-chars { text-align: right; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .msg-done { background: #fff; border-radius: 16px; padding: 12px 16px; font-style: italic; color: var(--ink); text-align: center; display: none; }
</style>
</head>
<body>

<!-- 1. Boas-vindas -->
<section class="screen active" id="welcome">
  <div class="brand"><i></i> <span data-cfg="nome">Mural de Fotos</span></div>
  <div class="hero">
    <div class="robot-wrap" id="heroRobot"></div>
    <h1>Tire sua foto e <span>apareça no telão!</span></h1>
    <p class="sub" data-cfg="chamada"></p>
    <label class="field">Seu nome (opcional)
      <input type="text" id="name" maxlength="40" placeholder="Como quer aparecer?" autocomplete="given-name">
    </label>
    <button class="btn btn-primary" id="start">Escolher moldura →</button>
    <div class="error" id="err1"></div>
  </div>
</section>

<!-- 2. Moldura -->
<section class="screen" id="choose">
  <div class="brand"><i></i> <span data-cfg="nome">Mural de Fotos</span></div>
  <h2 class="page-title">Escolha sua moldura</h2>
  <div class="frames" id="frames"></div>
  <div style="width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px;margin-top:auto">
    <button class="btn btn-primary" id="openCam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Abrir câmera
    </button>
    <button class="btn btn-ghost" id="backWelcome">Voltar</button>
    <div class="error" id="err0"></div>
  </div>
</section>

<!-- 3. Câmera -->
<section class="screen" id="camera">
  <div class="top-row">
    <div class="brand"><i></i> <span data-cfg="nome">Mural de Fotos</span></div>
    <button class="link-btn" id="changeFrame">Trocar moldura</button>
  </div>
  <div class="stage" id="stage">
    <video id="video" playsinline autoplay muted class="mirror"></video>
    <canvas class="fx mirror" id="fx"></canvas>
    <img class="frame" id="frameOverlay" alt="">
    <div class="count" id="count"></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="fx-status" id="fxStatus">Escolha um acessório (opcional)</div>
  <div class="controls">
    <button class="round" id="back" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="shutter" id="shoot" aria-label="Tirar foto"></button>
    <button class="round" id="flip" aria-label="Trocar câmera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9 13a3 3 0 0 1 5.2-2"/><path d="M15 13a3 3 0 0 1-5.2 2"/><path d="M14.5 8.8V11H12.3"/><path d="M9.5 17.2V15h2.2"/></svg></button>
  </div>
</section>

<!-- 4. Revisão -->
<section class="screen" id="review">
  <div class="brand"><i></i> <span data-cfg="nome">Mural de Fotos</span></div>
  <div class="result">
    <div class="photo-wrap" id="photoWrap"><img class="photo" id="preview" alt="Sua foto com a moldura" draggable="false"></div>
    <div>
      <div class="small-label">Figurinhas (toque para colocar, arraste para mover)</div>
      <div class="stickers" id="stickerBar"></div>
      <div class="st-tools" id="stTools">
        <button id="stSmaller">− Menor</button><button id="stBigger">+ Maior</button><button id="stRemove">🗑 Tirar</button>
      </div>
    </div>
    <label class="small-label">Deixe um recado (opcional)
      <textarea id="message" maxlength="140" placeholder="Escreva uma mensagem…"></textarea>
    </label>
    <div class="counter-chars"><span id="msgCount">0</span>/140</div>
    <div class="error" id="err2"></div>
    <div class="row">
      <button class="btn btn-ghost" id="retake">Tirar outra</button>
      <button class="btn btn-primary" id="send">Enviar ao telão</button>
    </div>
  </div>
</section>

<!-- 5. Sucesso -->
<section class="screen" id="done">
  <div class="brand"><i></i> <span data-cfg="nome">Mural de Fotos</span></div>
  <div class="result">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Pronto! Olhe para o telão 👀</h2>
    <p data-cfg="enviado"></p>
    <img class="photo" id="finalImg" alt="Sua foto">
    <div class="msg-done" id="msgDone"></div>
    <button class="btn btn-primary" id="save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      Salvar minha foto
    </button>
    <button class="btn btn-ghost" id="again">Tirar outra foto</button>
  </div>
</section>

<input type="file" id="fileInput" accept="image/*" capture="user">

<script src="/frame.js"></script>
<script src="/acessorios.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const F = window.PainelFrame, A = window.Acessorios;
  const dateText = new Date().toLocaleDateString('pt-BR');
  const STICKERS = (window.PAINEL.figurinhas || ['🎉', '🎂', '🥳', '💖', '⭐', '🌈', '🦄', '😂', '😎', '🔥', '👑', '🎈', '✨', '🐱', '🍕', '💜']);
  let stream = null, facing = 'user', busy = false, frameImg = null;
  let frameId = F.FRAMES[0].id, fxKind = 'nenhum', faces = [];
  let basePhoto = null, rawPhoto = null, finalPhoto = null;
  let stickers = [], selSticker = null;

  $('heroRobot').innerHTML = F.logoSVG();
  try { $('name').value = localStorage.getItem('mural-name') || ''; frameId = localStorage.getItem('mural-frame') || frameId; } catch {}
  if (!F.FRAMES.some((f) => f.id === frameId)) frameId = F.FRAMES[0].id;

  function show(id) {
    document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
  }
  function showErr(el, msg) { el.textContent = msg; el.classList.toggle('show', !!msg); }
  const getName = () => $('name').value.trim();
  const hole = () => F.byId(frameId).hole;

  // ---------- Molduras ----------
  function renderFrames() {
    $('frames').innerHTML = '';
    F.FRAMES.forEach((f) => {
      const b = document.createElement('button');
      b.className = 'frame-opt' + (f.id === frameId ? ' sel' : '');
      b.innerHTML = `<img alt="" src="${F.thumbURL(f.id, getName())}"><span>${f.nome}</span>`;
      b.onclick = () => { frameId = f.id; try { localStorage.setItem('mural-frame', frameId); } catch {} renderFrames(); };
      $('frames').appendChild(b);
    });
  }
  function placeVideo() {
    const h = hole();
    const box = { left: (h.x / F.W * 100) + '%', top: (h.y / F.H * 100) + '%', width: (h.w / F.W * 100) + '%', height: (h.h / F.H * 100) + '%' };
    Object.assign($('video').style, box);
    Object.assign($('fx').style, box);
  }
  async function prepareFrame() {
    const svg = F.frameSVG(frameId, getName(), dateText);
    $('frameOverlay').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    frameImg = await F.frameImage(frameId, getName(), dateText);
    placeVideo();
  }

  // ---------- Câmera ----------
  const liveCameraOk = () => window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  async function startCamera() {
    stopCamera();
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1920 } }, audio: false });
    const v = $('video');
    v.srcObject = stream;
    v.classList.toggle('mirror', facing === 'user');
    $('fx').classList.toggle('mirror', facing === 'user');
    await v.play().catch(() => {});
    loop();
  }
  function stopCamera() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }

  // ---------- Acessórios ao vivo ----------
  function renderChips() {
    $('chips').innerHTML = '';
    A.LISTA.forEach((a) => {
      const b = document.createElement('button');
      b.className = 'chip' + (a.id === fxKind ? ' sel' : '');
      b.innerHTML = `<b>${a.emoji}</b>${a.nome}`;
      b.onclick = () => chooseFx(a.id);
      $('chips').appendChild(b);
    });
  }
  async function chooseFx(id) {
    fxKind = id; renderChips();
    if (id === 'nenhum') { $('fxStatus').textContent = 'Escolha um acessório (opcional)'; return; }
    if (!A.pronto()) {
      $('fxStatus').textContent = 'Carregando acessórios…';
      try { await A.carregar(); } catch (e) {
        console.warn(e); fxKind = 'nenhum'; renderChips();
        $('fxStatus').textContent = 'Acessórios indisponíveis neste celular. Use as figurinhas depois da foto!';
        return;
      }
    }
    $('fxStatus').textContent = 'Funciona com várias pessoas na foto! 😄';
  }
  let raf = 0;
  function loop() {
    cancelAnimationFrame(raf);
    const v = $('video'), c = $('fx');
    const tick = () => {
      if (!stream) return;
      const cw = c.clientWidth, ch = c.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
      if (c.width !== Math.round(cw * dpr)) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      if (fxKind !== 'nenhum' && A.pronto() && v.videoWidth) {
        faces = A.suavizar(A.detectar(v, v.videoWidth, v.videoHeight));
        const s = Math.max(c.width / v.videoWidth, c.height / v.videoHeight);
        const ox = (c.width - v.videoWidth * s) / 2, oy = (c.height - v.videoHeight * s) / 2;
        A.desenhar(ctx, faces, fxKind, (p) => ({ x: ox + p.x * s, y: oy + p.y * s }));
      } else faces = [];
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }

  // ---------- Montagem da foto ----------
  // Foto sem moldura (só a câmera), guardada para o download do administrador
  function rawImage(source, sw, sh, mirror) {
    const max = 1600, s = Math.min(1, max / Math.max(sw, sh));
    const c = document.createElement('canvas'); c.width = Math.round(sw * s); c.height = Math.round(sh * s);
    const ctx = c.getContext('2d');
    if (mirror) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(source, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.9);
  }
  // Foto com acessórios + moldura
  function compose(source, sw, sh, mirror, fx) {
    const c = document.createElement('canvas');
    c.width = F.W; c.height = F.H;
    const ctx = c.getContext('2d');
    const { x, y, w, h } = hole();
    const scale = Math.max(w / sw, h / sh);
    const dw = sw * scale, dh = sh * scale, ox = x + (w - dw) / 2, oy = y + (h - dh) / 2;
    ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h);
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    if (mirror) { ctx.translate(x + w / 2, 0); ctx.scale(-1, 1); ctx.translate(-(x + w / 2), 0); }
    ctx.drawImage(source, ox, oy, dw, dh);
    if (fx && fx.length) A.desenhar(ctx, fx, fxKind, (p) => ({ x: ox + p.x * scale, y: oy + p.y * scale }));
    ctx.restore();
    ctx.drawImage(frameImg, 0, 0, F.W, F.H);
    return c.toDataURL('image/jpeg', 0.88);
  }

  function goReview() {
    stickers = []; selSticker = null;
    $('preview').src = basePhoto;
    renderStickers();
    showErr($('err2'), '');
    show('review');
  }

  // ---------- Fluxo ----------
  $('start').onclick = () => {
    try { localStorage.setItem('mural-name', getName()); } catch {}
    renderFrames(); show('choose');
  };
  $('backWelcome').onclick = () => show('welcome');
  $('openCam').onclick = async () => {
    showErr($('err0'), '');
    try { await prepareFrame(); } catch { return showErr($('err0'), 'Não foi possível carregar a moldura. Recarregue a página.'); }
    if (liveCameraOk()) {
      try { await startCamera(); renderChips(); show('camera'); return; }
      catch (e) { console.warn('Câmera ao vivo indisponível, usando câmera do sistema', e); }
    }
    $('fileInput').value = ''; $('fileInput').click();
  };
  $('changeFrame').onclick = () => { stopCamera(); renderFrames(); show('choose'); };

  // Alternativa: câmera nativa do celular
  $('fileInput').onchange = () => {
    const file = $('fileInput').files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      basePhoto = compose(img, img.naturalWidth, img.naturalHeight, false, []);
      rawPhoto = rawImage(img, img.naturalWidth, img.naturalHeight, false);
      URL.revokeObjectURL(url); goReview();
    };
    img.onerror = () => showErr($('err0'), 'Não consegui ler essa foto. Tente novamente.');
    img.src = url;
  };

  $('shoot').onclick = async () => {
    if (busy) return;
    busy = true;
    const el = $('count');
    for (const n of [3, 2, 1]) {
      el.textContent = n; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      await new Promise((r) => setTimeout(r, 900));
    }
    el.textContent = '';
    const fl = $('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
    const v = $('video');
    const mirror = facing === 'user';
    const fx = fxKind !== 'nenhum' && A.pronto() ? A.detectar(v, v.videoWidth, v.videoHeight) : [];
    basePhoto = compose(v, v.videoWidth, v.videoHeight, mirror, fx.length ? fx : faces);
    rawPhoto = rawImage(v, v.videoWidth, v.videoHeight, mirror);
    busy = false;
    stopCamera();
    goReview();
  };
  $('flip').onclick = async () => {
    facing = facing === 'user' ? 'environment' : 'user';
    try { await startCamera(); } catch { facing = 'user'; await startCamera().catch(() => {}); }
  };
  $('back').onclick = () => { stopCamera(); renderFrames(); show('choose'); };
  $('retake').onclick = async () => {
    if (liveCameraOk()) { try { await startCamera(); renderChips(); show('camera'); return; } catch {} }
    $('fileInput').value = ''; $('fileInput').click();
  };

  // ---------- Figurinhas ----------
  STICKERS.forEach((e) => {
    const b = document.createElement('button'); b.textContent = e;
    b.onclick = () => { stickers.push({ e, x: 0.5, y: 0.45, s: 0.16 }); selSticker = stickers.length - 1; renderStickers(); };
    $('stickerBar').appendChild(b);
  });
  function renderStickers() {
    const wrap = $('photoWrap');
    wrap.querySelectorAll('.sticker').forEach((n) => n.remove());
    const W = wrap.clientWidth || 300;
    stickers.forEach((st, i) => {
      const d = document.createElement('div');
      d.className = 'sticker' + (i === selSticker ? ' sel' : '');
      d.textContent = st.e;
      d.style.left = st.x * 100 + '%'; d.style.top = st.y * 100 + '%'; d.style.fontSize = (st.s * W) + 'px';
      d.onpointerdown = (ev) => {
        ev.preventDefault(); selSticker = i; d.setPointerCapture(ev.pointerId);
        wrap.querySelectorAll('.sticker').forEach((n, j) => n.classList.toggle('sel', j === i));
        $('stTools').classList.add('show');
        const r = wrap.getBoundingClientRect();
        d.onpointermove = (m) => {
          st.x = Math.min(1, Math.max(0, (m.clientX - r.left) / r.width));
          st.y = Math.min(1, Math.max(0, (m.clientY - r.top) / r.height));
          d.style.left = st.x * 100 + '%'; d.style.top = st.y * 100 + '%';
        };
        d.onpointerup = () => { d.onpointermove = null; };
      };
      wrap.appendChild(d);
    });
    $('stTools').classList.toggle('show', selSticker != null && !!stickers[selSticker]);
  }
  window.addEventListener('resize', () => { if ($('review').classList.contains('active')) renderStickers(); });
  $('stBigger').onclick = () => { const s = stickers[selSticker]; if (s) { s.s = Math.min(0.6, s.s * 1.25); renderStickers(); } };
  $('stSmaller').onclick = () => { const s = stickers[selSticker]; if (s) { s.s = Math.max(0.05, s.s / 1.25); renderStickers(); } };
  $('stRemove').onclick = () => { if (stickers[selSticker]) { stickers.splice(selSticker, 1); selSticker = null; renderStickers(); } };

  // Junta foto + figurinhas numa imagem final
  function withStickers() {
    if (!stickers.length) return Promise.resolve(basePhoto);
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = F.W; c.height = F.H;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        stickers.forEach((st) => { ctx.font = `${Math.round(st.s * F.W)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.fillText(st.e, st.x * F.W, st.y * F.H); });
        resolve(c.toDataURL('image/jpeg', 0.88));
      };
      img.src = basePhoto;
    });
  }

  // ---------- Recado e envio ----------
  $('message').oninput = () => { $('msgCount').textContent = $('message').value.length; };
  $('send').onclick = async () => {
    const btn = $('send');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Enviando…';
    showErr($('err2'), '');
    try {
      finalPhoto = await withStickers();
      const message = $('message').value.trim();
      const r = await fetch('/api/photos', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: finalPhoto, raw: rawPhoto, name: getName(), message, frame: frameId }),
      });
      if (!r.ok) throw new Error();
      $('finalImg').src = finalPhoto;
      $('msgDone').textContent = message ? `“${message}”` : '';
      $('msgDone').style.display = message ? 'block' : 'none';
      $('message').value = ''; $('msgCount').textContent = '0';
      show('done');
    } catch {
      showErr($('err2'), 'Ops! Não conseguimos enviar. Verifique a conexão e tente de novo.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar ao telão';
    }
  };

  $('save').onclick = async () => {
    try {
      const blob = await (await fetch(finalPhoto)).blob();
      const file = new File([blob], window.PAINEL.arquivoFoto + '.jpg', { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Minha foto no ' + window.PAINEL.nome });
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = finalPhoto; a.download = window.PAINEL.arquivoFoto + '.jpg';
    document.body.appendChild(a); a.click(); a.remove();
  };
  $('again').onclick = () => { renderFrames(); show('choose'); };
})();
</script>
</body>
</html>
